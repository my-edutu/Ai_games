[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarship-eligibility-predictor"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "numpy", "pandas", "scikit-learn", "fastapi", "joblib"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
