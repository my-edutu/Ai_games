[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-matching-engine"
version = "0.1.0"
description = "Safety-first eligibility and ranking engine for opportunities"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.5",
  "joblib>=1.4"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
