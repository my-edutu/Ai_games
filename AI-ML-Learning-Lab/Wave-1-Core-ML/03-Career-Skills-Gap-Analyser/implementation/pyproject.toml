[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="career-skills-gap-analyser"
version="0.1.0"
dependencies=["pydantic>=2","fastapi>=0.110","numpy>=1.24","scikit-learn>=1.3"]
[project.optional-dependencies]
dev=["pytest>=8","httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath=["src"]
