name: Marble Survival Gauntlet — real browser evidence

on:
  push:
    branches:
      - agent/marble-gauntlet-2026-10-08
    paths:
      - 'games/marble-survival/**'
      - 'tests/foundation/marble-*.test.cjs'
      - 'tests/browser/marble-*.spec.cjs'
      - '.github/workflows/marble-gauntlet.yml'
  pull_request:
    branches:
      - main
      - agent/marble-survival-2-5d-mainline
    paths:
      - 'games/marble-survival/**'
      - 'tests/foundation/marble-*.test.cjs'
      - 'tests/browser/marble-*.spec.cjs'
      - '.github/workflows/marble-gauntlet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push and draft-PR events on the same head branch share one live run.
  group: marble-gauntlet-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-and-browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Gauntlet branch
        uses: actions/checkout@v6
      - name: Archive exact tracked source for reproducible review
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/marble-source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/marble-source-commit.txt"
      - name: Retain tracked source without Git credentials or untracked files
        uses: actions/upload-artifact@v7
        with:
          name: marble-gauntlet-source
          path: |
            ${{ runner.temp }}/marble-source.tar
            ${{ runner.temp }}/marble-source-commit.txt
          if-no-files-found: error
          retention-days: 7
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile authoritative runtime
        run: npm run build
      - name: Run all Marble foundation and Gauntlet regression tests
        run: node --test tests/foundation/marble-*.test.cjs
      - name: Assert authoritative server starts and preserves API contracts
        run: node games/marble-survival/scripts/serve-complete-runtime.cjs --self-test
      - name: Install Chromium for actual WebGL screenshots
        run: npx playwright install --with-deps chromium
      - name: Run visual smoke, camera/label parity and tournament evidence capture
        run: npx playwright test --config games/marble-survival/playwright.config.cjs
        env:
          CI: 'true'
      - name: Upload real screenshots, renderer stats and browser traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marble-gauntlet-browser-evidence
          path: |
            artifacts/marble-visual-rebuild/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30

  catalogue-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify all catalogue regressions after main reintegration
        run: |
          set -o pipefail
          npm test 2>&1 | tee catalogue-regressions.log
      - name: Retain complete catalogue test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marble-integration-catalogue-tests
          path: catalogue-regressions.log
          if-no-files-found: warn
          retention-days: 14
