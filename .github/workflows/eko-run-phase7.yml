name: Eko Run Phase 7 Broadcast Presentation

on:
  push:
    branches:
      - agent/eko-run-phase7
      - agent/eko-run-phase7-closure
    paths:
      - 'games/eko-street-run/**'
      - 'tests/phase7/eko-run-*.test.cjs'
      - 'tests/browser/eko-run-phase7.spec.cjs'
      - 'tests/phase6/eko-run-*.test.cjs'
      - 'tests/phase5/eko-run-*.test.cjs'
      - 'tests/phase4/eko-run-*.test.cjs'
      - 'tests/phase3/eko-run-*.test.cjs'
      - 'tests/phase2/eko-run-*.test.cjs'
      - 'tests/foundation/eko-run-*.test.cjs'
      - 'scripts/run-eko-run-phase7-evidence.cjs'
      - '.github/workflows/eko-run-phase7.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'games/eko-street-run/**'
      - 'tests/phase7/eko-run-*.test.cjs'
      - 'tests/browser/eko-run-phase7.spec.cjs'
      - 'scripts/run-eko-run-phase7-evidence.cjs'
      - '.github/workflows/eko-run-phase7.yml'
      - 'package.json'

jobs:
  broadcast-presentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked toolchain
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Phase 7 presentation tests
        run: node --test tests/phase7/eko-run-*.test.cjs
      - name: Phase 6 regression tests
        run: node --test tests/phase6/eko-run-*.test.cjs
      - name: Phase 5 regression tests
        run: node --test tests/phase5/eko-run-*.test.cjs
      - name: Phase 4 regression tests
        run: node --test tests/phase4/eko-run-*.test.cjs
      - name: Phase 3 regression tests
        run: node --test tests/phase3/eko-run-*.test.cjs
      - name: Phase 2 regression tests
        run: node --test tests/phase2/eko-run-*.test.cjs
      - name: Phase 1 regression tests
        run: node --test tests/foundation/eko-run-*.test.cjs
      - name: Authority boundary scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E "from ['\"]three['\"]|require\(['\"]three['\"]\)|Math\.random|Date\.now|new Date\(" \
            games/eko-street-run/src/config \
            games/eko-street-run/src/state \
            games/eko-street-run/src/runtime \
            games/eko-street-run/src/physics \
            games/eko-street-run/src/rules \
            games/eko-street-run/src/hazards \
            games/eko-street-run/src/generation \
            games/eko-street-run/src/progression 2>/dev/null; then
            echo 'Presentation or ambient nondeterminism leaked into Eko Run authority.'
            exit 1
          fi
      - name: Phase 7 deterministic presentation evidence
        run: node scripts/run-eko-run-phase7-evidence.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Phase 7 browser safe-area capture
        run: npx playwright test tests/browser/eko-run-phase7.spec.cjs
      - name: Upload Phase 7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: eko-run-phase7-evidence
          path: evidence/eko-run/phase7
          if-no-files-found: error
          retention-days: 30
