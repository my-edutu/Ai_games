name: Tower Transformation Real Gameplay Evidence
on:
  push:
    branches: [feat/tower-transformation-gauntlet-20261101]
    paths:
      - .github/workflows/tower-transformation-visual-evidence.yml
      - games/infinite-tower-climb/src/**
      - public/infinite-tower-climb/visuals/**
      - public/infinite-tower-climb/styles.css
      - public/infinite-tower-climb/ux-v2.css
      - tests/browser/tower-ledge-contact.spec.cjs
      - tests/browser/tower-live-motion.spec.cjs
      - tests/phase3/tower-transformation-sanctuary.test.cjs
      - scripts/tower-motion-evidence.cjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tower-transformation-visual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authentic-ledge:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Visual resources and geometry safety (not a quality score)
        run: node --test tests/phase3/tower-transformation-sanctuary.test.cjs tests/phase3/tower-vista-environment.test.cjs tests/phase3/tower-world-geometry.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Record real source-matched desktop and phone climb stills
        run: |
          mkdir -p artifacts/tower-ledge-contact
          git rev-parse HEAD > artifacts/tower-ledge-contact/source-sha.txt
          npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-ledge-contact.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-transformation-ledge-${{ github.sha }}
          path: |
            artifacts/tower-ledge-contact/
            test-results/
          retention-days: 7
  normal-speed-play:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: climb
            floor: 0
          - scenario: guardian
            floor: 8
    env:
      TOWER_LAUNCH_FLOOR: ${{ matrix.floor }}
      TOWER_MOTION_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Reject frozen/misrepresented motion captures
        run: node --test tests/phase3/tower-motion-evidence.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Record real normal-speed desktop and phone gameplay
        run: |
          mkdir -p artifacts/tower-motion
          git rev-parse HEAD > artifacts/tower-motion/source-sha.txt
          npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-live-motion.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-transformation-motion-${{ matrix.scenario }}-${{ github.sha }}
          path: |
            artifacts/tower-motion/
            test-results/
          retention-days: 7
# Uploading real GPU evidence is not a LOOKS/FEELS/PLAYS verdict.
# Frozen-baseline matched clips, >=60s scenarios, independent votes and
# intended-device frame pacing remain separate and required to grade quality.
