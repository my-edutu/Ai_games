name: Tower Transformation Real Gameplay Evidence
# P0 runner-admission: normal source pushes no longer enqueue NINE heavyweight
# evidence jobs while the hosted queue has no available runners. Explicit
# workflow_dispatch or a commit to the request path still pins candidate to
# immutable github.sha. This neither edits gameplay nor cures runner shortage.
on:
  push:
    branches: [feat/tower-transformation-gauntlet-20261101]
    paths:
      - public/infinite-tower-climb/gauntlet/capture-request.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tower-transformation-visual-${{ github.sha }}
  cancel-in-progress: false
jobs:
  authentic-ledge:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Use the actual candidate runtime, unmodified 20-Hz steps, and the
      # identical guardian seed/config used by the danger film. Failed or
      # incomplete causal evidence remains a visible failed step and saved
      # source artifact. Do NOT prevent subsequent real browser recording:
      # a missing source episode is a P0 blocker, not a reason to lose film.
      - name: Audit two original same-run guardian/crusher-to-restart source campaigns
        id: source-chain
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dir=artifacts/tower-ledge-contact/source-campaign
          mkdir -p "$dir"
          git rev-parse HEAD > "$dir/source-sha.txt"
          for replay in 1 2; do
            node scripts/tower-guardian-source-witness.cjs > "$dir/replay-${replay}.json" 2>"$dir/replay-${replay}.stderr"
          done
          node scripts/tower-campaign-audit.cjs "$dir/replay-1.json" "$dir/replay-2.json" "$dir/audit.json" "$GITHUB_SHA"
      - name: Verify actual candidate 20Hz moving-deck source trace before film
        run: node --test tests/phase3/tower-moving-fixed-step-source-trace.test.cjs
      - name: Visual resources and geometry safety (not a quality score)
        run: node --test tests/phase3/tower-transformation-sanctuary.test.cjs tests/phase3/tower-vista-environment.test.cjs tests/phase3/tower-world-geometry.test.cjs tests/phase3/tower-earned-gateway-frame.test.cjs
      # GitHub-hosted Ubuntu occasionally fails DNS resolution for apt-only fonts.
      # A mirror outage must not prevent original browser footage.
      - name: Install and probe actual Playwright Chromium / WebGL2 without apt
        run: |
          npx playwright install chromium
          node scripts/tower-chromium-host-preflight.cjs
      - name: Record real source-matched desktop and phone climb stills
        run: |
          mkdir -p artifacts/tower-ledge-contact
          git rev-parse HEAD > artifacts/tower-ledge-contact/source-sha.txt
          npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-ledge-contact.spec.cjs
      # Capture source proof can fail while browser stills are retained. Never
      # allow continue-on-error to silently turn an incomplete source chain
      # into a successful original-game evidence job.
      - name: Veto incomplete guardian/crusher through real restart source chain
        if: always()
        shell: bash
        env:
          SOURCE_CHAIN_OUTCOME: ${{ steps.source-chain.outcome }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_CHAIN_OUTCOME" != success ]]; then
            echo 'Original 3200-tick guardian/crusher -> grounded gateway -> floor nine -> result/intermission/restart chain was not proved. P0 remains NOT EVALUATED.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-transformation-ledge-${{ github.sha }}
          path: |
            artifacts/tower-ledge-contact/
            test-results/
          retention-days: 7
  normal-speed-play:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: baseline
            ref: 1731b380851162741761c5569e2bc152a0869ca9
            scenario: ascent
            floor: 0
          # The live stream overrides the default to guardianInterval=8.
          # Capture a real floor-8 guardian for BOTH frozen-source comparisons.
          - source: baseline
            ref: 1731b380851162741761c5569e2bc152a0869ca9
            scenario: danger
            floor: 8
          - source: baseline
            ref: 1731b380851162741761c5569e2bc152a0869ca9
            scenario: outcome
            floor: 0
          # Supplemental paired source-authentic motion on floor 7, where
          # generated platform p3 actually moves. This is NOT a replacement
          # for the required ascent/guardian/outcome acceptance matrix.
          - source: baseline
            ref: 1731b380851162741761c5569e2bc152a0869ca9
            scenario: moving
            floor: 7
          - source: candidate
            ref: ${{ github.sha }}
            scenario: ascent
            floor: 0
          - source: candidate
            ref: ${{ github.sha }}
            scenario: danger
            floor: 8
          - source: candidate
            ref: ${{ github.sha }}
            scenario: outcome
            floor: 0
          - source: candidate
            ref: ${{ github.sha }}
            scenario: moving
            floor: 7
    env:
      TOWER_LAUNCH_FLOOR: ${{ matrix.floor }}
      TOWER_MOTION_SCENARIO: ${{ matrix.scenario }}
      TOWER_SEED: tower-transformation-capture-v1
      TOWER_CAPTURE_UNALTERED_SOURCE: '1'
      # Start each ORIGINAL 20Hz host only after Chrome/video context exists.
      # Retain the strict <=60 source-tick comparison and all native film gates.
      TOWER_CAPTURE_LATE_HOST_START: '1'
    steps:
      - name: Checkout the actual game source being assessed
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: source
          persist-credentials: false
      - name: Checkout current evidence harness without replacing baseline game files
        if: matrix.source == 'baseline'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: current-harness
          persist-credentials: false
      - name: Install neutral capture harness; do NOT overwrite frozen game's server
        if: matrix.source == 'baseline'
        run: |
          cp current-harness/tests/browser/tower-live-motion.spec.cjs source/tests/browser/tower-live-motion.spec.cjs
          cp current-harness/scripts/tower-motion-evidence.cjs source/scripts/tower-motion-evidence.cjs
          cp current-harness/scripts/tower-crossfire-evidence.cjs source/scripts/tower-crossfire-evidence.cjs
          cp current-harness/scripts/tower-event-alignment.cjs source/scripts/tower-event-alignment.cjs
          cp current-harness/scripts/tower-event-pairing.cjs source/scripts/tower-event-pairing.cjs
          # The immutable baseline predates native-video calibration. Copy
          # ONLY observational harness code; never alter its game or host.
          cp current-harness/scripts/tower-video-timebase.cjs source/scripts/tower-video-timebase.cjs
          cp current-harness/scripts/tower-event-frame-probes.cjs source/scripts/tower-event-frame-probes.cjs
          cp current-harness/scripts/tower-native-hud-floor.cjs source/scripts/tower-native-hud-floor.cjs
          cp current-harness/scripts/tower-native-scene-phase.cjs source/scripts/tower-native-scene-phase.cjs
          cp current-harness/tests/phase3/tower-native-hud-floor.test.cjs source/tests/phase3/tower-native-hud-floor.test.cjs
          cp current-harness/tests/phase3/tower-native-scene-phase.test.cjs source/tests/phase3/tower-native-scene-phase.test.cjs
          cp current-harness/tests/phase3/tower-event-frame-probes.test.cjs source/tests/phase3/tower-event-frame-probes.test.cjs
          cp current-harness/scripts/tower-native-compositor-anchors.cjs source/scripts/tower-native-compositor-anchors.cjs
          cp current-harness/tests/phase3/tower-native-compositor-anchors.test.cjs source/tests/phase3/tower-native-compositor-anchors.test.cjs
          cp current-harness/scripts/tower-native-film-integrity.cjs source/scripts/tower-native-film-integrity.cjs
          cp current-harness/tests/phase3/tower-native-film-integrity.test.cjs source/tests/phase3/tower-native-film-integrity.test.cjs
          cp current-harness/tests/phase3/tower-video-timebase.test.cjs source/tests/phase3/tower-video-timebase.test.cjs
          cp current-harness/scripts/tower-capture-window.cjs source/scripts/tower-capture-window.cjs
          cp current-harness/scripts/tower-fixed-step-trace.cjs source/scripts/tower-fixed-step-trace.cjs
          cp current-harness/scripts/tower-source-trace-poller.cjs source/scripts/tower-source-trace-poller.cjs
          # Independent original-host observation must exist inside the frozen
          # checkout's neutral harness; frozen game/host bytes remain untouched.
          cp current-harness/scripts/tower-public-state-witness.cjs source/scripts/tower-public-state-witness.cjs
          cp current-harness/scripts/tower-chromium-host-preflight.cjs source/scripts/tower-chromium-host-preflight.cjs
          cp current-harness/tests/phase3/tower-public-state-witness.test.cjs source/tests/phase3/tower-public-state-witness.test.cjs
          cp current-harness/tests/phase3/tower-source-trace-poller.test.cjs source/tests/phase3/tower-source-trace-poller.test.cjs
          cp current-harness/tests/phase3/tower-fixed-step-trace.test.cjs source/tests/phase3/tower-fixed-step-trace.test.cjs
          cp current-harness/tests/phase3/tower-capture-window.test.cjs source/tests/phase3/tower-capture-window.test.cjs
          cp current-harness/tests/phase3/tower-event-alignment.test.cjs source/tests/phase3/tower-event-alignment.test.cjs
          cp current-harness/scripts/tower-source-capture-server.cjs source/scripts/tower-source-capture-server.cjs
          cp current-harness/scripts/tower-capture-host-lifecycle.cjs source/scripts/tower-capture-host-lifecycle.cjs
          cp current-harness/tests/phase3/tower-capture-host-lifecycle.test.cjs source/tests/phase3/tower-capture-host-lifecycle.test.cjs
          cp current-harness/playwright.tower.config.cjs source/playwright.tower.config.cjs
          # The SOURCE-controlled app, game runtime, scene, and stream host
          # are immutable at the original frozen checkout SHA.
          git -C source diff --exit-code -- scripts/serve-tower-stream.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install source dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund
      - name: Build actual source authority and presentation
        working-directory: source
        run: npm run build
      - name: Prove scoped video integrity before browser capture
        id: scoped_integrity
        continue-on-error: true
        working-directory: source
        run: node --test tests/phase3/tower-motion-evidence.test.cjs tests/phase3/tower-event-alignment.test.cjs tests/phase3/tower-capture-window.test.cjs tests/phase3/tower-capture-host-lifecycle.test.cjs tests/phase3/tower-fixed-step-trace.test.cjs tests/phase3/tower-source-trace-poller.test.cjs tests/phase3/tower-public-state-witness.test.cjs tests/phase3/tower-video-timebase.test.cjs tests/phase3/tower-event-frame-probes.test.cjs tests/phase3/tower-native-compositor-anchors.test.cjs tests/phase3/tower-native-film-integrity.test.cjs
      # Match the frozen source's original Playwright binary without fetching
      # Ubuntu font packages. Abort if the actual browser lacks WebGL2.
      - name: Install and probe original-source Chromium / WebGL2 without apt
        working-directory: source
        run: |
          npx playwright install chromium
          node scripts/tower-chromium-host-preflight.cjs
      # Hosted ubuntu-24.04 can omit BOTH native transport binaries, and
      # azure.archive.ubuntu.com DNS failures caused ALL EIGHT source-pinned
      # browser recordings to be cancelled after 20+ minutes of apt retries
      # (original capture 43040799182). Never depend on apt here. npm ci
      # has already passed: use version-pinned, platform-selected static
      # FFmpeg/FFprobe packages in an isolated runner temp dir ONLY when
      # missing. Do not install packages or change lockfiles in either
      # frozen baseline or candidate checkout. Missing tools still VETO film.
      - name: Install and verify native WebM transport auditors without apt
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            tool_root="$RUNNER_TEMP/tower-native-webm-tools"
            mkdir -p "$tool_root/bin"
            # Bound registry/network failures; never stall all eight capture
            # workers on a runner's unreachable Ubuntu apt mirror.
            timeout 180s npm --prefix "$tool_root" \
              --fetch-retries=1 --fetch-timeout=30000 \
              --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=2500 \
              install --no-save --no-package-lock --ignore-scripts \
              --no-audit --no-fund \
              @ffmpeg-installer/ffmpeg@1.1.0 \
              @ffprobe-installer/ffprobe@2.1.2
            TOOL_ROOT="$tool_root" node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.TOOL_ROOT;
          for (const [name, packageName] of [
            ['ffmpeg', '@ffmpeg-installer/ffmpeg'],
            ['ffprobe', '@ffprobe-installer/ffprobe'],
          ]) {
            const binary = require(path.join(root, 'node_modules', packageName)).path;
            if (!binary || !fs.existsSync(binary)) {
              throw new Error('Missing platform-native ' + name + ' executable');
            }
            fs.symlinkSync(binary, path.join(root, 'bin', name));
          }
          NODE
            echo "$tool_root/bin" >> "$GITHUB_PATH"
            export PATH="$tool_root/bin:$PATH"
          fi
          command -v ffprobe
          command -v ffmpeg
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1
      - name: Pin provenance and capture full-motion authentic desktop and phone play
        id: pin_source
        working-directory: source
        run: |
          mkdir -p artifacts/tower-motion
          git diff --exit-code -- scripts/serve-tower-stream.cjs
          git rev-parse HEAD > artifacts/tower-motion/source-sha.txt
          git hash-object scripts/serve-tower-stream.cjs > artifacts/tower-motion/source-game-host-blob.txt
          echo "TOWER_CAPTURE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "${{ github.sha }}" > artifacts/tower-motion/evidence-harness-sha.txt
      # Both independent original 20Hz source hosts MUST be attempted even if
      # desktop recording fails. Otherwise the CI artifact cannot diagnose
      # whether phone footage is independently valid. Continue-on-error is ONLY
      # a collection mechanism: the final gate uses step OUTCOME, not
      # conclusion (which is masked by continue-on-error), and vetoes the job.
      # Never reuse one server between viewports or alter original source time.
      - name: Record desktop 960x600 on a fresh original-source 20Hz host
        id: record_desktop
        if: always() && steps.pin_source.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-live-motion.spec.cjs --grep 'normal-speed Tower motion desktop'
      - name: Retain desktop test failure diagnostics before Playwright clears them
        if: always() && steps.pin_source.outcome == 'success'
        working-directory: source
        run: |
          if [ -d test-results ]; then
            mkdir -p artifacts/tower-motion/test-results-desktop
            cp -a test-results/. artifacts/tower-motion/test-results-desktop/
          fi
      - name: Record portrait 390x844 on another fresh original-source 20Hz host
        id: record_portrait
        if: always() && steps.pin_source.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-live-motion.spec.cjs --grep 'normal-speed Tower motion portrait'
      - name: Retain portrait test failure diagnostics separately
        if: always() && steps.pin_source.outcome == 'success'
        working-directory: source
        run: |
          if [ -d test-results ]; then
            mkdir -p artifacts/tower-motion/test-results-portrait
            cp -a test-results/. artifacts/tower-motion/test-results-portrait/
          fi
      - name: Audit ACTUAL native WebM dimensions, decoded PTS span and source sidecars
        id: audit_original_webm
        if: always() && steps.pin_source.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: |
          node scripts/tower-native-film-integrity.cjs \
            "artifacts/tower-motion/${{ matrix.scenario }}" \
            "$TOWER_CAPTURE_SOURCE_SHA" "${{ matrix.scenario }}" \
            > "artifacts/tower-motion/${{ matrix.scenario }}/native-film-integrity.json"
      # Read-only, source-tick-indexed stills from the already unmodified
      # native WebMs. This is an inspection unblocker, not a simulated
      # gameplay recording or a positive transformation score. It never
      # changes source host, game, recording frame rate or original film.
      - name: Extract genuine event-neighbor video frames for human review
        id: film_frame_probes
        if: always() && steps.audit_original_webm.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: |
          node scripts/tower-event-frame-probes.cjs             "artifacts/tower-motion/${{ matrix.scenario }}"             "$TOWER_CAPTURE_SOURCE_SHA" "${{ matrix.scenario }}"
          if [[ "${{ matrix.scenario }}" == "danger" ]]; then
            node scripts/tower-native-scene-phase.cjs "artifacts/tower-motion/danger" "$TOWER_CAPTURE_SOURCE_SHA"
          fi
      - name: Preserve both viewport outcomes and veto failed capture
        if: always() && steps.pin_source.outcome == 'success'
        working-directory: source
        shell: bash
        env:
          DESKTOP_OUTCOME: ${{ steps.record_desktop.outcome }}
          PORTRAIT_OUTCOME: ${{ steps.record_portrait.outcome }}
          WEBM_OUTCOME: ${{ steps.audit_original_webm.outcome }}
          FILM_PROBES_OUTCOME: ${{ steps.film_frame_probes.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.scoped_integrity.outcome }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/tower-motion
          printf 'scoped-preflight=%s\ndesktop=%s\nportrait=%s\nnative-webm-integrity=%s\nevent-frame-probes=%s\n' \
            "$PREFLIGHT_OUTCOME" "$DESKTOP_OUTCOME" "$PORTRAIT_OUTCOME" "$WEBM_OUTCOME" "$FILM_PROBES_OUTCOME" \
            > artifacts/tower-motion/capture-step-outcomes.txt
          if [[ "$PREFLIGHT_OUTCOME" != success || "$DESKTOP_OUTCOME" != success ||
                "$PORTRAIT_OUTCOME" != success || "$WEBM_OUTCOME" != success ||
                "$FILM_PROBES_OUTCOME" != success ]]; then
            echo 'Original-source capture incomplete. All available native clips, sidecars and per-viewport failure traces are retained; P0 remains NOT EVALUATED.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-motion-${{ matrix.source }}-${{ matrix.scenario }}-${{ github.run_id }}
          path: |
            source/artifacts/tower-motion/
            source/test-results/
          retention-days: 7
# These captures are source-pinned genuine CI browser footage, not a quality
# comparison verdict or supported-device performance measurement. Blind
# randomized reviewers and native-hardware frame-time tails remain mandatory.

  pair-source-events:
    needs: normal-speed-play
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download unmodified source-pinned footage and sidecars
        uses: actions/download-artifact@v4
        with:
          pattern: tower-motion-*-${{ github.run_id }}
          path: artifacts/tower-event-pair-input
          merge-multiple: false
      - name: Audit all source event correspondences; never assign a quality verdict
        env:
          TOWER_EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          node --test tests/phase3/tower-event-pairing.test.cjs
          node scripts/tower-event-pairing.cjs artifacts/tower-event-pair-input artifacts/tower-event-pairs/manifest.json
      # The earlier 8/8 calibrated clocks are search aids, not an A/B film.
      # Package ACTUAL unmodified full 60+s guardian videos, randomized
      # anonymously and cued to the respective source's genuine native event
      # time. Missing source beats stay explicit, never invented as matches.
      - name: Assemble original full-motion event-relative A/B for human inspection
        env:
          TOWER_EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          node --test tests/phase3/tower-event-review-playlist.test.cjs
          node scripts/tower-event-review-playlist.cjs artifacts/tower-event-pair-input artifacts/tower-event-pairs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-ungraded-event-pairs-${{ github.run_id }}
          path: artifacts/tower-event-pairs/
          retention-days: 7
      # This second archive contains ONLY anonymous untouched A/B WebMs and
      # the reviewer page. Never distribute the audit/provenance JSON to
      # blinded critics; the separate evidence archive keeps the exact SHAs.
      # Missing shared native source events remain visibly UNSYNCHRONIZED;
      # uploading playable originals does not override the failing P0 veto.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-blind-original-duel-${{ github.run_id }}
          path: artifacts/tower-event-pairs/blind-review/
          retention-days: 7
          if-no-files-found: warn
