name: Tower Transformation Real Gameplay Evidence
on:
  push:
    branches: [feat/tower-transformation-gauntlet-20261101]
    paths:
      - .github/workflows/tower-transformation-visual-evidence.yml
      - playwright.tower.config.cjs
      - scripts/tower-source-capture-server.cjs
      - games/infinite-tower-climb/src/**
      - public/infinite-tower-climb/visuals/**
      - public/infinite-tower-climb/styles.css
      - public/infinite-tower-climb/ux-v2.css
      - tests/browser/tower-ledge-contact.spec.cjs
      - tests/browser/tower-live-motion.spec.cjs
      - tests/phase3/tower-transformation-sanctuary.test.cjs
      - tests/phase3/tower-earned-gateway-frame.test.cjs
      - scripts/tower-motion-evidence.cjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tower-transformation-visual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authentic-ledge:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Report original fixed-step guardian progress without awarding game quality
        run: node scripts/tower-guardian-source-witness.cjs
      - name: Visual resources and geometry safety (not a quality score)
        run: node --test tests/phase3/tower-transformation-sanctuary.test.cjs tests/phase3/tower-vista-environment.test.cjs tests/phase3/tower-world-geometry.test.cjs tests/phase3/tower-earned-gateway-frame.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Record real source-matched desktop and phone climb stills
        run: |
          mkdir -p artifacts/tower-ledge-contact
          git rev-parse HEAD > artifacts/tower-ledge-contact/source-sha.txt
          npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-ledge-contact.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-transformation-ledge-${{ github.sha }}
          path: |
            artifacts/tower-ledge-contact/
            test-results/
          retention-days: 7
  normal-speed-play:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: baseline
            ref: 1731b380851162741761c5569e2bc152a0869ca9
            scenario: ascent
            floor: 0
          # The live stream overrides the default to guardianInterval=8.
          # Capture a real floor-8 guardian for BOTH frozen-source comparisons.
          - source: baseline
            ref: 1731b380851162741761c5569e2bc152a0869ca9
            scenario: danger
            floor: 8
          - source: baseline
            ref: 1731b380851162741761c5569e2bc152a0869ca9
            scenario: outcome
            floor: 0
          # Supplemental paired source-authentic motion on floor 7, where
          # generated platform p3 actually moves. This is NOT a replacement
          # for the required ascent/guardian/outcome acceptance matrix.
          - source: baseline
            ref: 1731b380851162741761c5569e2bc152a0869ca9
            scenario: moving
            floor: 7
          - source: candidate
            ref: ${{ github.sha }}
            scenario: ascent
            floor: 0
          - source: candidate
            ref: ${{ github.sha }}
            scenario: danger
            floor: 8
          - source: candidate
            ref: ${{ github.sha }}
            scenario: outcome
            floor: 0
          - source: candidate
            ref: ${{ github.sha }}
            scenario: moving
            floor: 7
    env:
      TOWER_LAUNCH_FLOOR: ${{ matrix.floor }}
      TOWER_MOTION_SCENARIO: ${{ matrix.scenario }}
      TOWER_SEED: tower-transformation-capture-v1
      TOWER_CAPTURE_UNALTERED_SOURCE: '1'
    steps:
      - name: Checkout the actual game source being assessed
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: source
          persist-credentials: false
      - name: Checkout current evidence harness without replacing baseline game files
        if: matrix.source == 'baseline'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: current-harness
          persist-credentials: false
      - name: Install neutral capture harness; do NOT overwrite frozen game's server
        if: matrix.source == 'baseline'
        run: |
          cp current-harness/tests/browser/tower-live-motion.spec.cjs source/tests/browser/tower-live-motion.spec.cjs
          cp current-harness/scripts/tower-motion-evidence.cjs source/scripts/tower-motion-evidence.cjs
          cp current-harness/scripts/tower-crossfire-evidence.cjs source/scripts/tower-crossfire-evidence.cjs
          cp current-harness/scripts/tower-event-alignment.cjs source/scripts/tower-event-alignment.cjs
          cp current-harness/tests/phase3/tower-event-alignment.test.cjs source/tests/phase3/tower-event-alignment.test.cjs
          cp current-harness/scripts/tower-source-capture-server.cjs source/scripts/tower-source-capture-server.cjs
          cp current-harness/playwright.tower.config.cjs source/playwright.tower.config.cjs
          # The SOURCE-controlled app, game runtime, scene, and stream host
          # are immutable at the original frozen checkout SHA.
          git -C source diff --exit-code -- scripts/serve-tower-stream.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install source dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund
      - name: Build actual source authority and presentation
        working-directory: source
        run: npm run build
      - name: Prove scoped video integrity before browser capture
        working-directory: source
        run: node --test tests/phase3/tower-motion-evidence.test.cjs tests/phase3/tower-event-alignment.test.cjs
      - name: Install Chromium
        working-directory: source
        run: npx playwright install --with-deps chromium
      - name: Pin provenance and capture full-motion authentic desktop and phone play
        working-directory: source
        run: |
          mkdir -p artifacts/tower-motion
          git diff --exit-code -- scripts/serve-tower-stream.cjs
          git rev-parse HEAD > artifacts/tower-motion/source-sha.txt
          git hash-object scripts/serve-tower-stream.cjs > artifacts/tower-motion/source-game-host-blob.txt
          echo "TOWER_CAPTURE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "${{ github.sha }}" > artifacts/tower-motion/evidence-harness-sha.txt
      - name: Record at least 60 seconds of normal-speed autonomous WebGL gameplay
        working-directory: source
        run: npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-live-motion.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-motion-${{ matrix.source }}-${{ matrix.scenario }}-${{ github.run_id }}
          path: |
            source/artifacts/tower-motion/
            source/test-results/
          retention-days: 7
# These captures are source-pinned genuine CI browser footage, not a quality
# comparison verdict or supported-device performance measurement. Blind
# randomized reviewers and native-hardware frame-time tails remain mandatory.

  pair-source-events:
    needs: normal-speed-play
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download unmodified source-pinned footage and sidecars
        uses: actions/download-artifact@v4
        with:
          pattern: tower-motion-*-${{ github.run_id }}
          path: artifacts/tower-event-pair-input
          merge-multiple: false
      - name: Audit all source event correspondences; never assign a quality verdict
        env:
          TOWER_EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          node --test tests/phase3/tower-event-pairing.test.cjs
          node scripts/tower-event-pairing.cjs artifacts/tower-event-pair-input artifacts/tower-event-pairs/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-ungraded-event-pairs-${{ github.run_id }}
          path: artifacts/tower-event-pairs/
          retention-days: 7
