name: Tiny Kingdom W431 Civic Ground and Original Running World
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w431-civic-grounding.test.cjs'
      - '.github/workflows/tiny-kingdom-w431-civic-grounding.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w431-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  original-civic-grounding-and-workday:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Original civic foundation source and behavior contract
        run: node --test tests/browser/tiny-kingdom-w431-civic-grounding.test.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Record authentic desktop and 390px village and retained citizen control
        run: npx playwright test tests/browser/tiny-kingdom-w428-mobile-workday.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w431-original-civic-grounding
          path: |
            artifacts/tiny-kingdom-w428/
            test-results/
          if-no-files-found: warn
          retention-days: 14
