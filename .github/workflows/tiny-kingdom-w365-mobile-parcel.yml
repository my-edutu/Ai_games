name: Tiny Kingdom W365 Mobile Parcel Viewport Evidence
on:
  pull_request:
    branches: [main]
    paths:
      - public/tiny-kingdom/index.html
      - tests/browser/tiny-kingdom-w365-mobile-parcel.spec.cjs
      - scripts/tiny-kingdom-w365-physical-courier-contract.cjs
      - .github/workflows/tiny-kingdom-w365-mobile-parcel.yml
  workflow_dispatch:
jobs:
  real-mobile-parcel:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/tiny-kingdom-w365-physical-courier-contract.cjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: W365 uncut original 390px 3D village and actual five parcel stages
        run: npx playwright test tests/browser/tiny-kingdom-w365-mobile-parcel.spec.cjs --workers=1
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w365-real-mobile-parcel
          path: |
            artifacts/tiny-kingdom-w365-mobile-parcel/
            test-results/
          retention-days: 14
