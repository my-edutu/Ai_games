name: Tiny Kingdom W216 Authentic Moving-View Geometry Residency
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-w216-camera-dynamic-contract.cjs'
      - 'scripts/tiny-kingdom-w219-camera-view-contract.cjs'
      - 'scripts/tiny-kingdom-w220-static-ray-contract.cjs'
      - 'tests/browser/tiny-kingdom-w216-moving-view-residency.spec.cjs'
      - '.github/workflows/tiny-kingdom-w216-moving-view-residency.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w216-moving-view-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  original-moving-world:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: W219 physical camera view reuse RED-first contract
        run: node scripts/tiny-kingdom-w219-camera-view-contract.cjs
      - name: W220 unchanged town physical ray index versus REAL moving grain freight
        run: node scripts/tiny-kingdom-w220-static-ray-contract.cjs
      - run: npm run build
      - name: W271 paused mobile orbit rig residency source contract
        run: node scripts/tiny-kingdom-w271-orbit-worker-detail-contract.cjs
      - name: Prove real tick/worker/market invalidation and embedded game syntax
        run: node scripts/tiny-kingdom-w216-camera-dynamic-contract.cjs
      - run: npx playwright install --with-deps chromium
      - name: Original paused 1024px and 390px camera-orbit WebGL, replay and VBO reuse
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CI: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w216-moving-view-residency.spec.cjs --workers=1 --reporter=line
      - name: Preserve exact-source moving-game video and screenshots, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w216-authentic-moving-view
          path: |
            artifacts/tiny-kingdom-w216/
            test-results/
          if-no-files-found: warn
          retention-days: 14
