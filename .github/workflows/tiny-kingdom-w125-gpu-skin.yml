name: Tiny Kingdom W125 Original Working Citizens GPU Joint Evidence

on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-w125-gpu-skin-contract.cjs'
      - 'scripts/tiny-kingdom-w212-passive-skin-contract.cjs'
      - 'tests/browser/tiny-kingdom-w212-real-passive-gpu.spec.cjs'
      - 'tests/browser/tiny-kingdom-w125-gpu-bone-same-world.spec.cjs'
      - 'scripts/tiny-kingdom-w128-detailed-workskin-contract.cjs'
      - 'tests/browser/tiny-kingdom-w128-detailed-workskin.spec.cjs'
      - '.github/workflows/tiny-kingdom-w125-gpu-skin.yml'
  workflow_dispatch:

permissions:
  contents: read

# Every exact-source workflow keeps its own evidence when concurrent edits land.
concurrency:
  # A stable PR number bounds future pending captures without cancelling a running one.
  group: tiny-kingdom-w125-skin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  original-worker-skeleton:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Playwright's shared webServer imports the compiled replay package;
      # missing build aborted original-worker browser capture before it booted.
      - run: npm run build
      - name: Prove original worker joint tags and exact mathematical endpoints
        run: |
          node scripts/tiny-kingdom-w125-gpu-skin-contract.cjs
          node scripts/tiny-kingdom-w212-passive-skin-contract.cjs
      - name: Verify original full-detail worker joint-space mapping
        run: node scripts/tiny-kingdom-w128-detailed-workskin-contract.cjs
      - name: Install supported real Chromium
        run: npx playwright install --with-deps chromium
      - name: Match authentic paused-simulation original and GPU worker scenes at desktop and 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w125-gpu-bone-same-world.spec.cjs --reporter=line
      - name: Real detailed original workers with live GPU joints at 1024px and 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w128-detailed-workskin.spec.cjs --workers=1 --reporter=line
      - name: Actual source-identical resting inhabitants, same saved world on 1024px and 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w212-real-passive-gpu.spec.cjs --workers=1 --reporter=line
      - name: Publish screenshots, browser videos, and failing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w125-actual-worker-gpu-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
