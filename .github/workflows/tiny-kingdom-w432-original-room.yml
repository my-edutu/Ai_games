name: Tiny Kingdom W432 Existing Inhabited Rooms and Running World
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w432-original-room.test.cjs'
      - 'tests/browser/tiny-kingdom-w432-inhabited-room.spec.cjs'
      - 'tests/browser/tiny-kingdom-w481-upper-storey.test.cjs'
      - 'tests/browser/tiny-kingdom-w481-upper-storey.spec.cjs'
      - '.github/workflows/tiny-kingdom-w432-original-room.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w432-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  actual-occupied-home-and-autonomy:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Original detailed-home shell unit geometry and syntax
        run: node --test tests/browser/tiny-kingdom-w432-original-room.test.cjs tests/browser/tiny-kingdom-w481-upper-storey.test.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Actual 3D home at desktop and 390px and preserved authority
        run: npx playwright test tests/browser/tiny-kingdom-w432-inhabited-room.spec.cjs tests/browser/tiny-kingdom-w481-upper-storey.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w432-original-occupied-home
          path: |
            artifacts/tiny-kingdom-w432/
            artifacts/tiny-kingdom-w481/
            test-results/
          if-no-files-found: warn
          retention-days: 14
