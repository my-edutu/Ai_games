name: Tiny Kingdom read-only verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/tiny-kingdom/*.test.cjs
      - run: npm run build
      - run: npm run tiny:stream:self-test
      - run: npx playwright test --config playwright.tiny.config.cjs
      - run: npm test
