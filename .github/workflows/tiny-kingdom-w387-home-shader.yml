name: Tiny Kingdom W387 Actual Original Occupied-Home Shader A-B
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w387-home-shader.spec.cjs'
      - '.github/workflows/tiny-kingdom-w387-home-shader.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w387-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  actual-home-matched-scene:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Actual Chromium WebGL 1024px/390px identical world and authentic buildings GPU modes
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w387-home-shader.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w387-actual-home-shader-ab
          path: |
            artifacts/tiny-kingdom-w387-home-shader/
            test-results/
          retention-days: 14
