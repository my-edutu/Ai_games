name: Tiny Kingdom W411 Real Market Gallery and Portrait Workday
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w411-real-market-gallery.spec.cjs'
      - '.github/workflows/tiny-kingdom-w411-real-market-gallery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w411-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  original-market-workday:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Real gallery geometry, safe trade routes, mobile physical camera
        run: node --test tests/browser/tiny-kingdom-w411-real-market-gallery.spec.cjs tests/browser/tiny-kingdom-w408-market-frontage.spec.cjs tests/browser/tiny-kingdom-w410-open-sky-exchange.spec.cjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Film actual authoritative merchant on 1024px and 390px
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CI: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w410-exchange-film.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w411-authentic-market-workday
          path: artifacts/tiny-kingdom-w410/
          if-no-files-found: warn
          retention-days: 14
