name: Tiny Kingdom W227 Real Cold Scenery Spine Evidence
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w227-cold-scenery.spec.cjs'
      - '.github/workflows/tiny-kingdom-w227-cold-scene.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w227-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  cold-static-original-world:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/tiny-kingdom-w229-shared-road-sampling-contract.cjs
      - run: node scripts/tiny-kingdom-w230-axis-prism-contract.cjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real complete Day1 world cold build and frame-stage CPU diagnostics
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CI: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w227-cold-scenery.spec.cjs --workers=1 --reporter=line
      - name: Preserve source-pinned real screenshots and stage traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w227-real-cold-scene
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
