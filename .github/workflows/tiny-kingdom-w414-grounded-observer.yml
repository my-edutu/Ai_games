name: Tiny Kingdom W414 Physically Grounded Workday Camera
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w414-grounded-observer.spec.cjs'
      - 'tests/browser/tiny-kingdom-w413-observed-worksite-runtime.spec.cjs'
      - '.github/workflows/tiny-kingdom-w414-grounded-observer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w414-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  real-workday-grounding:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Real terrain eye, roof and invalid-projection contract
        run: node --test tests/browser/tiny-kingdom-w414-grounded-observer.spec.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Actual desktop and 390px uncut workday evidence
        run: npx playwright test tests/browser/tiny-kingdom-w413-observed-worksite-runtime.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w414-real-workday-after-terrain-guard
          path: |
            artifacts/tiny-kingdom-w413/
            test-results/
          if-no-files-found: warn
          retention-days: 14
