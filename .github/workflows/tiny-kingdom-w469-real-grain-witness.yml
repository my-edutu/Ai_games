name: Tiny Kingdom W469 Real Grain Workday Witness
on:
  push:
    branches: [feat/tiny-kingdom-post-main-gauntlet-20261031]
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w469-queued-real-grain.spec.cjs'
      - '.github/workflows/tiny-kingdom-w469-real-grain-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w469-${{ github.ref }}
  cancel-in-progress: false
jobs:
  genuine-mobile-desktop-grain-workday:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install chromium
      - run: npx playwright test tests/browser/tiny-kingdom-w469-queued-real-grain.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w469-actual-moving-workday-390-desktop
          path: |
            artifacts/tiny-kingdom-w469/
            test-results/
          if-no-files-found: warn
          retention-days: 14
