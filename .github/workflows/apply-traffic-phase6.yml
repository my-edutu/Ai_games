name: Apply AI City Traffic Phase 6 bundle

on:
  push:
    branches:
      - feat/ai-city-traffic-production

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and apply candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/traffic-phase6-bundle/part-* | base64 --decode > /tmp/traffic-phase6.tar.gz
          echo "d3795eab1dd76226cc1ff12c03185bffcf64936ab76e33de31c435ac880114bf  /tmp/traffic-phase6.tar.gz" | sha256sum --check --strict
          if tar -tzf /tmp/traffic-phase6.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path detected" >&2
            exit 1
          fi
          tar -xzf /tmp/traffic-phase6.tar.gz -C .
          rm -rf .github/traffic-phase6-bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(traffic): complete production candidate governance"
          git push origin HEAD:feat/ai-city-traffic-production
