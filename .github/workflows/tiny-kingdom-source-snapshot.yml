name: Tiny Kingdom source review snapshot
on:
  push:
    branches: [feat/tiny-kingdom-gauntlet-3d]
    paths:
      - '.github/workflows/tiny-kingdom-source-snapshot.yml'
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-w188-home-season-residency-contract.cjs'
      - 'scripts/tiny-kingdom-w189-linear-scene-pack-contract.cjs'
      - 'scripts/tiny-kingdom-w190-nav-node-residency-contract.cjs'
      - 'scripts/tiny-kingdom-w191-navigation-sightline-contract.cjs'
      - 'scripts/tiny-kingdom-w192-graded-road-contract.cjs'
      - 'scripts/tiny-kingdom-w193-authentic-bridge-contract.cjs'
      - 'scripts/tiny-kingdom-w242-original-workshop-contract.cjs'
      - 'scripts/tiny-kingdom-w243-original-compact-human-contract.cjs'
      - 'scripts/tiny-kingdom-w244-real-farm-gate-and-forest-contract.cjs'
      - 'scripts/tiny-kingdom-w183-daybreak-physical-flight-contract.cjs'
      - 'scripts/tiny-kingdom-w126-authentic-workday-contract.cjs'
      - 'tests/browser/tiny-kingdom-w126-medieval-workday.spec.cjs'
      - 'tests/browser/tiny-kingdom-w126-farm-to-market-film.spec.cjs'
      - '.github/workflows/tiny-kingdom-source-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
# Preserve running exact-source evidence; replace only obsolete pending PR runs.
concurrency:
  group: tiny-kingdom-source-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: W188 real seasonal home-cache source contract and full game syntax
        run: node scripts/tiny-kingdom-w188-home-season-residency-contract.cjs
      - name: W189 conservative full-geometry packing and W183 submitted camera contract
        run: |
          node scripts/tiny-kingdom-w189-linear-scene-pack-contract.cjs
          node scripts/tiny-kingdom-w183-daybreak-physical-flight-contract.cjs
      - name: W190 exact 35-home navigation-grid and equal-count restore parity
        run: node scripts/tiny-kingdom-w190-nav-node-residency-contract.cjs
      - name: W191 original 4cm LOS residency, authentic construction and save/restore
        run: node scripts/tiny-kingdom-w191-navigation-sightline-contract.cjs
      - name: W192 graded physical village roads with real contact seams and untouched economy
        run: node scripts/tiny-kingdom-w192-graded-road-contract.cjs
      - name: W193 joined real oak-and-stone original village bridge geometry
        run: node scripts/tiny-kingdom-w193-authentic-bridge-contract.cjs
      - name: W240 actual arcade roof camera and open receiving sightlines
        run: |
          node scripts/tiny-kingdom-w208-original-market-arcade-and-wagonway-contract.cjs
          node scripts/tiny-kingdom-w240-authentic-market-camera-contract.cjs
      - name: W242 existing high-street two-storey workshop geometry and authority guard
        run: node scripts/tiny-kingdom-w242-original-workshop-contract.cjs
      - name: W243 genuine compact-human craniofacial silhouette and live IK wrist contract
        run: node scripts/tiny-kingdom-w243-original-compact-human-contract.cjs
      - name: W244 real field gate aperture and original near/mid forest resource contract
        run: node scripts/tiny-kingdom-w244-real-farm-gate-and-forest-contract.cjs
      - name: Archive exact Tiny Kingdom source for standalone native WebGL review
        run: |
          git rev-parse HEAD > source-sha.txt
          tar -czf tiny-kingdom-source.tgz \
            AGENTS.md package.json package-lock.json playwright.config.cjs \
            public/tiny-kingdom games/tiny-ai-civilization \
            scripts/tiny-kingdom* tests/browser/tiny-kingdom*
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            source-sha.txt
            tiny-kingdom-source.tgz
          retention-days: 3
