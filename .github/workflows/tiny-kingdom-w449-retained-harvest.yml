name: Tiny Kingdom W449 Real Harvest Resident GPU Parity
on:
  push:
    branches: [feat/tiny-kingdom-post-main-gauntlet-20261031]
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w449-retained-harvest.spec.cjs'
      - '.github/workflows/tiny-kingdom-w449-retained-harvest.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w449-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  real-credited-farmer-harvest-desktop-and-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Actual positive farmer harvest source/retained GPU parity
        run: npx playwright test tests/browser/tiny-kingdom-w449-retained-harvest.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w449-real-harvest-resident-parity
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
