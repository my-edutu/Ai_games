name: Diagnose AI Escape Room canonical candidate
# Completion review integrity diagnostic: 2026-08-18
# Same-repository pull-request execution marker v8

on:
  push:
    branches:
      - agent/ai-escape-room-all-phases
  pull_request:
    branches:
      - agent/ai-escape-room-all-phases

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical candidate transport
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate compressed and decompressed layers
        shell: bash
        run: |
          set -euo pipefail
          transport=.github/escape-room-candidate.tar.gz
          test -f "$transport"
          compressed_size="$(wc -c < "$transport")"
          compressed_sha="$(sha256sum "$transport" | awk '{print $1}')"
          echo "compressed size: ${compressed_size}"
          echo "compressed sha256: ${compressed_sha}"
          gzip -t "$transport"
          gzip -dc "$transport" > /tmp/escape-candidate.tar
          payload_size="$(wc -c < /tmp/escape-candidate.tar)"
          payload_sha="$(sha256sum /tmp/escape-candidate.tar | awk '{print $1}')"
          echo "payload size: ${payload_size}"
          echo "payload sha256: ${payload_sha}"
          tar -tf /tmp/escape-candidate.tar > /tmp/escape-candidate-files.txt
          echo "payload entries: $(wc -l < /tmp/escape-candidate-files.txt)"
          sed -n '1,20p' /tmp/escape-candidate-files.txt
          test "$compressed_size" -eq 7515
          test "$payload_size" -gt 0
