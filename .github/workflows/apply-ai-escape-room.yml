name: Apply AI Escape Room reviewed candidate

on:
  push:
    branches:
      - agent/ai-escape-room-all-phases

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out isolated feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct checksum-pinned reviewed source bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/escape-changes.b64
          for sha in \
            79db2de92b6024648d1725c10ba045ac7373c464 \
            8e232b09837c59c76f6026ec7f59932ba829c455 \
            2c64155bd0d1d8a210a7db1be45cca136ea29d90 \
            3fabf9c498409583c3b1953cd161b054077a04f4 \
            b39576972ffda900e76803c7417eaafffe727b9f \
            cb7ff203c086f6a2f1e67b99041b058df529b89c \
            9373826de8120996c7da6cf814b61a1455f06fcf \
            0f9597b14845c37805bcce5b22364fac5a2c431f \
            f8b931549332af1a675ad90b68caab6605b563db \
            bc9cdfc2f6e2f3a869b77c5ed8f94fbb85bfbb27 \
            ca2057ee4438007046369285a063dfaa03ea079a \
            f6b4a55528f99cb4783bb2567c00e5a144bcf4dd
          do
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode >> /tmp/escape-changes.b64
          done

          test "$(wc -c < /tmp/escape-changes.b64)" -eq 89410
          base64 --decode /tmp/escape-changes.b64 > /tmp/escape-changes.tar.gz
          echo '80518dd2c9683ec85bd56a0c433444a12cd658d1d2ecd7d3b437c5522f37e876  /tmp/escape-changes.tar.gz' | sha256sum -c -
          tar -xzf /tmp/escape-changes.tar.gz -C .

      - name: Create exact candidate commit without retaining bootstrap workflow
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-ai-escape-room.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat(escape-room): complete phases 4-6 production candidate'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify exact candidate
        shell: bash
        env:
          CANDIDATE_SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          npm run clean
          npm run build
          node --test tests/escape-room/*.test.cjs
          npm run escape-room:headless
          npm run escape-room:campaign
          npm run escape-room:stream:self-test
          npm run escape-room:phase5:chaos
          npm run escape-room:phase6:validate
          if grep -RInE 'Math\.random|Date\.now|new Date\(' games/ai-escape-room/src --include='*.ts'; then
            echo 'Authoritative nondeterminism detected.' >&2
            exit 1
          fi

      - name: Push verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git push origin HEAD:agent/ai-escape-room-all-phases
