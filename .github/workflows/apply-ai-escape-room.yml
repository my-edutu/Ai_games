name: Apply AI Escape Room reviewed candidate

on:
  push:
    branches:
      - agent/ai-escape-room-all-phases

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore checksum-pinned reviewed changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/escape-candidate.b64
          for sha in \
            d20d5d2c7a87c1a0d56a8eccfe5108998a28a1b9 \
            a88533beffb4df8b9d41652777b737358e6cf485 \
            508d51328d6ee5ed1b2f68b2c70513b8eea4c2af \
            cb13ab7315d4e5fab450c62af749453838d57c6e \
            3cec1a6694103e032a6a133cf198a07718b57dd7 \
            bdc895296f7ac707a794ae2f9764f0c1e34d0232 \
            b343aeec29cc4c6eed9015e8f0977cbea13e6a38 \
            1bed7e5e4ed410af48f19650a86c699ef88228e2
          do
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 --decode >> /tmp/escape-candidate.b64
          done
          test "$(wc -c < /tmp/escape-candidate.b64)" -eq 55380
          echo '56804e0a239d03ce0e1aaca70a5772d2abf413a8b0efd085011c8460acb37c10  /tmp/escape-candidate.b64' | sha256sum -c -
          base64 --decode /tmp/escape-candidate.b64 > /tmp/escape-candidate.tar.gz
          test "$(wc -c < /tmp/escape-candidate.tar.gz)" -eq 41535
          echo '0bff6f11ef283c1bb06e39170a5ae7dc4298b75dcd84340585a12c5e14d1b1eb  /tmp/escape-candidate.tar.gz' | sha256sum -c -
          tar -xzf /tmp/escape-candidate.tar.gz -C .

      - name: Create exact candidate commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-ai-escape-room.yml
          rm -f .github/workflows/export-source.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat(escape-room): complete phases 4-6 production candidate'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify exact Escape Room candidate
        shell: bash
        env:
          CANDIDATE_SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          npm run clean
          npm run build
          node --test tests/escape-room/*.test.cjs
          node scripts/run-escape-room-headless.cjs
          node scripts/run-escape-room-campaign.cjs
          node scripts/serve-escape-room-stream.cjs --self-test
          node scripts/run-escape-room-phase5-chaos.cjs
          node scripts/run-escape-room-phase6-validation.cjs
          if grep -RInE 'Math\.random|Date\.now|new Date\(' games/ai-escape-room/src --include='*.ts'; then
            echo 'Authoritative nondeterminism detected.' >&2
            exit 1
          fi
          if grep -RInE '\b(TBD|TODO|FIXME)\b|implement later|optimize later|handle appropriately' games/ai-escape-room docs/operations/ai-escape-room* evidence/ai-escape-room services/escape-room-channel; then
            echo 'Release placeholder detected.' >&2
            exit 1
          fi

      - name: Push verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/ai-escape-room-all-phases
