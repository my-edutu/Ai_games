name: Tiny Kingdom W465 Actual Mobile Market Arrival
on:
  push:
    branches: [feat/tiny-kingdom-post-main-gauntlet-20261031]
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w465-mobile-arrival.spec.cjs'
      - '.github/workflows/tiny-kingdom-w465-mobile-arrival.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w465-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  actual-mobile-and-desktop-day1-day121:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The repository-wide Playwright config launches four catalogue servers;
      # each requires the compiled dist/packages/* tree before a Tiny test starts.
      - run: npm run build
      - run: node --test scripts/tiny-kingdom-w466-market-court-contract.cjs
      # Ubuntu runner already includes Chromium runtime libraries; --with-deps invokes
      # apt and currently fails on external 503 mirrors before any game frames run.
      # Install the exact @playwright/test 1.55.0 browser binary without apt.
      - run: npx playwright install chromium
      - run: npx playwright test tests/browser/tiny-kingdom-w465-mobile-arrival.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w465-actual-day1-day121-mobile-and-desktop
          path: |
            artifacts/tiny-kingdom-w465/
            test-results/
          if-no-files-found: warn
          retention-days: 14
