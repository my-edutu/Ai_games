name: Eko Run 3D Gauntlet Vertical Slice
on:
  push:
    branches: [feat/eko-run-3d-gauntlet-slice]
    paths:
      - 'public/eko-run/**'
      - 'scripts/serve-eko-run.cjs'
      - 'tests/eko/**'
      - 'tests/browser/eko-run-gauntlet.spec.cjs'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/eko-gauntlet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/eko-run/**'
      - 'scripts/serve-eko-run.cjs'
      - 'tests/eko/**'
      - 'tests/browser/eko-run-gauntlet.spec.cjs'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/eko-gauntlet.yml'

concurrency:
  group: eko-gauntlet-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playable-3d-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build authoritative TypeScript
        run: npm run build
      - name: Host/API integration tests
        run: node --test tests/eko/*.test.cjs
      - name: Observe eight-seed autonomous Gauntlet campaign
        run: node scripts/eko-gauntlet-run-soak.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture real gameplay, full-resolution and portrait visual evidence
        run: npx playwright test tests/browser/eko-run-gauntlet.spec.cjs tests/browser/eko-run-visual-captures.spec.cjs
      - name: Upload real browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eko-run-gauntlet-captures
          path: |
            artifacts/eko-gauntlet/
            test-results/
          retention-days: 14
          if-no-files-found: warn
