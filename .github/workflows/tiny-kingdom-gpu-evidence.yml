name: Tiny Kingdom GPU Evidence

on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/**'
      # W45: 1.37 MB evidence history and visual scorecard text updates do
      # not alter the playable renderer. Avoid launching 20 GPU jobs just
      # because an honest PASS/FAIL link was refreshed. Real source, image,
      # asset, JS and CSS changes still trigger the full suite as before.
      - '!public/tiny-kingdom/progress.html'
      - '!public/tiny-kingdom/experience.html'
      - 'tests/browser/tiny-kingdom*.spec.cjs'
      - 'scripts/tiny-kingdom-gpu-evidence.cjs'
      - 'scripts/tiny-kingdom-g154-scene-packer-contract.cjs'
      - '.github/workflows/tiny-kingdom-gpu-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # W79/W80: authentic original market court, real courier camera continuity
  # and stage-to-receipt witness on desktop + 390px.
  # Source-only geometry checks are not a look/feel/play acceptance pass.
  w79-open-market:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: W79/W80 actual market and uninterrupted genuine 390px delivery-to-receipt
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w79-open-market-gateway.spec.cjs tests/browser/tiny-kingdom-w80-continuous-market-journey.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w79-real-market-construction
          path: |
            artifacts/tiny-kingdom-w79/
            artifacts/tiny-kingdom-w80/
            test-results/
          retention-days: 14
  # W78: original stationary civic/farm/market is retained while real grown
  # cottages receive independent GPU updates. Both widths simulate 120 days.
  w78-real-civic-cluster-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
