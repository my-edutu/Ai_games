      - run: npx playwright install --with-deps chromium
      - name: W78 authentic 120-day original civic + housing buffers and mobile
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w78-independent-civic-street.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w78-stationary-civic-real-growth
          path: |
            artifacts/tiny-kingdom-w78/
            test-results/
