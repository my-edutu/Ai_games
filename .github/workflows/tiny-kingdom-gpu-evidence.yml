name: Tiny Kingdom GPU Evidence

on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/**'
      - 'tests/browser/tiny-kingdom*.spec.cjs'
      - 'scripts/tiny-kingdom-gpu-evidence.cjs'
      - 'scripts/tiny-kingdom-g154-scene-packer-contract.cjs'
      - '.github/workflows/tiny-kingdom-gpu-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # W25 same-seed actual worker-led housing builds on one software WebGL
  # runner, earlier W24 exact git object versus new W25. CPU wall timings and
  # real screenshots only; NEVER assert quality or GPU hardware FPS.
  w25-growth-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Source-matched W24 vs W25 true house-build frame timing and real 390px pictures
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w25-growth-profile.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w25-matched-growth-profile
          path: artifacts/tiny-kingdom/
          retention-days: 14
  # W25: physical civic quarter is retained in its own GPU VBO through
  # real settlement growth; never replace it with an impostor.
  w25-civic-residency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: W25 original physical civic quarters remain GPU resident while real builders add homes
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w25-civic-residency.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w25-civic-residency
          path: test-results/
          retention-days: 14
  # W24: genuine viewport-aware perspective at 390px, no moved/hidden citizens,
  # original roofs/posts intact and snapshots byte-identical after camera.
  w24-portrait-world-lens:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real 390px market panorama, unchanged autonomous villagers and desktop optics
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w24-portrait-world-lens.spec.cjs tests/browser/tiny-kingdom-w26-wall-clock-camera.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w24-portrait-lens
          path: test-results/
          retention-days: 14
  # W22: one worker's continuous physical task is a genuine visible action,
  # not a looping boot slide or a static tool pointing at a fake station.
  # Independent of legacy all-catalogue browser failures.
  w22-grounded-real-labor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Genuine autonomous worksite planted boots and two-hand animated contact, desktop and 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w22-grounded-labor-cadence.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w22-grounded-labor
          path: test-results/
          retention-days: 14
  # W15 ground-under-actual-homes is independently bounded. The enormous
  # legacy catalogue suite can time out without hiding this vertical gate.
  w15-ground-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: W15 real growing homes reuse immutable albedo without synthetic buildings
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w15-ground-atlas-residency.spec.cjs --workers=1
      - name: W16 RED-first lived market roads, resident foundations and 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w16-lived-ground.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w15-ground-residency
          path: test-results/
          retention-days: 14
  # W21 lived-in-workday documentary camera gate. The selected, physically
  # filmable worker must be the worker the observer actually sees on desktop
  # and portrait, without rewriting a simulation event or hidden structure.
  w21-real-workday-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real worker selected equals real camera shown at desktop and 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w21-workday-director-camera.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w21-workday-camera
          path: test-results/
          retention-days: 14
  # W17 mobile moving-film regression, kept short and independent of the
  # catalogue's slower legacy browser assertions.  This is a rendering/camera
  # correctness floor, never an independent LOOK/FEEL/PLAY quality verdict.
  w17-market-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: W17 real market panorama and connected Day1/Day120 mobile workday lens
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w17-market-journey-lens.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w17-mobile-market-lens
          path: test-results/
          retention-days: 14
  # Independent short-running W04/W05 browser gate. The legacy full GPU
  # suite exceeds its time limit and contains known older failures; it must
  # not hide a genuine harvested-field / autonomy regression.
  w04-real-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Actual farmer harvest, crop vertex deformation, fixed pace, replay and 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w04-real-harvest-aftermath.spec.cjs --workers=1
      - name: W07 RED-first - preserve a physically open inhabited medieval market court
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w07-inhabited-market-square.spec.cjs --workers=1
      - name: W08 physically traced actual loaded courier route, exact economy and mobile proof
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w08-authentic-courier-traces.spec.cjs --workers=1
      - name: W09 RED - actually escrow working citizens' loads until physical unloading
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w09-real-goods-escrow.spec.cjs --workers=1
      - name: W10 physically stocked original 3D market stalls, no fake goods, 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w10-truthful-market-stalls.spec.cjs --workers=1
      - name: W11 immersive human-height market camera with true pedestrian controls at 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w11-immersive-street.spec.cjs --workers=1
      - name: W12 one command dock and no lost keyboard or touch input at software FPS
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w12-pedestrian-input.spec.cjs --workers=1
      - name: W14 RED-first live citizen-mesh camera residency and true authority at 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w14-live-motion-residency.spec.cjs --workers=1
      - name: W13 observed true field production to physical receiving with camera, 390px, immutable authority
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w13-real-market-journey.spec.cjs --workers=1
      - name: W06 RED-before - actual Day-120 market visibility at 1024px and 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w06-readable-market-path.spec.cjs --workers=1
      - name: W05 live farm cut-row plots, physically tied sheaves, replay and 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w05-lived-harvest-field.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w05-harvest-witness
          path: test-results/
          retention-days: 14
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Playwright's configured webServer imports dist/packages/replay; an
      # unbuilt checkout makes the W02 browser test fail before it ever runs.
      - name: Build browser webServer dependencies
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture WebGL capability and frame
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p artifacts/tiny-kingdom
          node scripts/tiny-kingdom-gpu-evidence.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-gpu-evidence
          path: artifacts/tiny-kingdom/
          retention-days: 14
      - name: G154 spatial scene packing preserves every original triangle and material
        run: node scripts/tiny-kingdom-g154-scene-packer-contract.cjs
      - name: W02 real granary inventory, food-view safety and mobile interaction
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          npx playwright test tests/browser/tiny-kingdom-w02-granary-inventory.spec.cjs --workers=1
      - name: W03 real village-first documentary entry across desktop and mobile
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          npx playwright test tests/browser/tiny-kingdom-w03-lived-village-entry.spec.cjs --workers=1
      - name: G150–G155 real market composition, continuous pedestrian circuit, home rendering and 390px framing
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          npm run build
          npx playwright test tests/browser/tiny-kingdom-g150-market-visit.spec.cjs tests/browser/tiny-kingdom-g151-market-composition.spec.cjs tests/browser/tiny-kingdom-g152-market-legibility.spec.cjs tests/browser/tiny-kingdom-g153-house-geometry-cache.spec.cjs tests/browser/tiny-kingdom-g154-night-market.spec.cjs tests/browser/tiny-kingdom-g155-market-circuit.spec.cjs --workers=1
      - name: G163 real Day-120 articulated citizen population at 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          npx playwright test tests/browser/tiny-kingdom-g163-lived-population.spec.cjs --workers=1
      - name: G165 real production-to-market documentary at Day-120 on 390px
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          npx playwright test tests/browser/tiny-kingdom-g165-lived-supply-journey.spec.cjs --workers=1
      - name: Cinematic lighting, mobile HUD and real WebGL art-direction regression
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          npx playwright test tests/browser/tiny-kingdom-visual-direction.spec.cjs --workers=1
      - name: Focused Tiny Kingdom render, autonomy and live-workday contracts
        env:
          CI: '1'
        run: |
          npm run build
          npx playwright test tests/browser/tiny-kingdom-g066-compact-houses.spec.cjs tests/browser/tiny-kingdom-g067-dynamic-gpu-buffer.spec.cjs tests/browser/tiny-kingdom-g068-camera-lock.spec.cjs tests/browser/tiny-kingdom-g069-render-profile.spec.cjs tests/browser/tiny-kingdom-g070-festival-static.spec.cjs tests/browser/tiny-kingdom-g071-sunrise-emission.spec.cjs tests/browser/tiny-kingdom-g072-triangle-writer.spec.cjs tests/browser/tiny-kingdom-g073-ellipsoid-emission.spec.cjs tests/browser/tiny-kingdom-g074-static-typed-cache.spec.cjs tests/browser/tiny-kingdom-g075-shadow-gradient.spec.cjs tests/browser/tiny-kingdom-g076-box-corners.spec.cjs tests/browser/tiny-kingdom-g077-landscape-cache.spec.cjs tests/browser/tiny-kingdom-g078-landscape-buffer.spec.cjs tests/browser/tiny-kingdom-g079-gamma-pass.spec.cjs tests/browser/tiny-kingdom-g080-grass-distance.spec.cjs tests/browser/tiny-kingdom-g081-compact-side-windows.spec.cjs tests/browser/tiny-kingdom-g082-shingle-stagger.spec.cjs tests/browser/tiny-kingdom-g083-reference-capture.spec.cjs tests/browser/tiny-kingdom-g084-compact-half-timber.spec.cjs tests/browser/tiny-kingdom-g085-meadow-noise-lod.spec.cjs tests/browser/tiny-kingdom-g086-compact-facing.spec.cjs tests/browser/tiny-kingdom-g087-roof-dormers.spec.cjs tests/browser/tiny-kingdom-g088-roof-palette.spec.cjs tests/browser/tiny-kingdom-g089-meadow-farfield.spec.cjs tests/browser/tiny-kingdom-g089-forest-budget.spec.cjs tests/browser/tiny-kingdom-g090-lived-workday.spec.cjs tests/browser/tiny-kingdom-g091-active-labor.spec.cjs tests/browser/tiny-kingdom-g092-live-shift.spec.cjs tests/browser/tiny-kingdom-g093-occupational-cinema.spec.cjs tests/browser/tiny-kingdom-g094-inhabited-street.spec.cjs tests/browser/tiny-kingdom-g095-market-quarter.spec.cjs tests/browser/tiny-kingdom-g096-lived-highstreet.spec.cjs tests/browser/tiny-kingdom-g097-market-carriers.spec.cjs tests/browser/tiny-kingdom-g098-supply-delivery.spec.cjs tests/browser/tiny-kingdom-g099-market-handoff.spec.cjs tests/browser/tiny-kingdom-g105-scenic-visibility.spec.cjs tests/browser/tiny-kingdom-g106-cinematic-visibility.spec.cjs tests/browser/tiny-kingdom-g107-guildhall-district.spec.cjs tests/browser/tiny-kingdom-g108-street-morphology.spec.cjs tests/browser/tiny-kingdom-g109-lived-cinema.spec.cjs tests/browser/tiny-kingdom-g111-ground-surface.spec.cjs tests/browser/tiny-kingdom-g112-live-lighting.spec.cjs tests/browser/tiny-kingdom-g113-street-walk.spec.cjs tests/browser/tiny-kingdom-g114-street-visibility.spec.cjs tests/browser/tiny-kingdom-g115-street-encounter.spec.cjs tests/browser/tiny-kingdom-g116-street-crowd.spec.cjs tests/browser/tiny-kingdom-g117-visible-worksites.spec.cjs tests/browser/tiny-kingdom-g118-human-proportions.spec.cjs tests/browser/tiny-kingdom-g119-worksite-choreography.spec.cjs tests/browser/tiny-kingdom-g121-builder-stage.spec.cjs tests/browser/tiny-kingdom-g122-facing-work.spec.cjs tests/browser/tiny-kingdom-g123-oriented-society.spec.cjs tests/browser/tiny-kingdom-g124-seasonal-landscape-residency.spec.cjs tests/browser/tiny-kingdom-g125-physical-reach.spec.cjs tests/browser/tiny-kingdom-g126-day120-facing.spec.cjs tests/browser/tiny-kingdom-g127-open-worksite.spec.cjs tests/browser/tiny-kingdom-g128-architectural-materials.spec.cjs tests/browser/tiny-kingdom-g129-baked-software-tier.spec.cjs tests/browser/tiny-kingdom-g130-mobile-worldview.spec.cjs tests/browser/tiny-kingdom-g131-camera-lod.spec.cjs tests/browser/tiny-kingdom-g132-worksite-director.spec.cjs tests/browser/tiny-kingdom-g134-civic-residency.spec.cjs tests/browser/tiny-kingdom-g135-visible-workday-camera.spec.cjs tests/browser/tiny-kingdom-g140-settlement-residency.spec.cjs tests/browser/tiny-kingdom-g141-day-night-society.spec.cjs tests/browser/tiny-kingdom-g142-physical-homecoming.spec.cjs tests/browser/tiny-kingdom-g143-homecoming-lanterns.spec.cjs tests/browser/tiny-kingdom-g144-grounded-homecoming.spec.cjs tests/browser/tiny-kingdom-g149-market-life.spec.cj