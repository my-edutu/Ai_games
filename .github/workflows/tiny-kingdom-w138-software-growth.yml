# W232 runner-network recovery: installing Ubuntu apt packages via Playwright
# fails when GitHub's Ubuntu mirrors cannot resolve (2026-11-11 W231).
# Download the Chromium browser without rerunning apt on each parallel job.
# This is NOT a rendering or gameplay acceptance, and requires browser proof.
name: Tiny Kingdom W138 Grown-Town Rendering Evidence
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-w138-software-home-contract.cjs'
      - 'tests/browser/tiny-kingdom-w138-real-grown-home.spec.cjs'
      - '.github/workflows/tiny-kingdom-w138-software-growth.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A stable PR number bounds future pending captures without cancelling a running one.
  group: tiny-kingdom-w138-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  original-grown-town:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test-first grown SwiftShader dirty-block policy and original resident geometry
        run: node scripts/tiny-kingdom-w138-software-home-contract.cjs
      # Playwright's shared webServer starts Snake/Maze/Ant/Tower services from dist.
      # Without a compiled replay package, the W138 Day-120 game never launches.
      - name: Build shared browser server dependencies before 120-day WebGL capture
        run: npm run build
      - run: npx playwright install chromium
      - name: Genuine 120-day old/new renderer comparison and real 390px gameplay
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w138-real-grown-home.spec.cjs --workers=1
      - name: Preserve video, 1024px and 390px images and runtime audits even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w138-grown-software-original-webgl
          path: |
            test-results/
          if-no-files-found: warn
          retention-days: 14
