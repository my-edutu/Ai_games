name: Tiny Kingdom W276 Real Settlement Routes and Mobile Parcel Camera
on:
  workflow_dispatch:
  push:
    branches: [feat/tiny-kingdom-post-main-gauntlet-20261031]
    paths:
      - public/tiny-kingdom/index.html
      - scripts/tiny-kingdom-w276-route-access-contract.cjs
      - scripts/tiny-kingdom-w276-mobile-contract.cjs
      - tests/browser/tiny-kingdom-w276-economy-camera.spec.cjs
      - .github/workflows/tiny-kingdom-w276-integrated.yml
permissions:
  contents: read
jobs:
  original-running-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/tiny-kingdom-w276-route-access-contract.cjs
      - run: node scripts/tiny-kingdom-w276-mobile-contract.cjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Genuine desktop and 390px autonomous economy presentation
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w276-economy-camera.spec.cjs --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w276-actual-growth-and-mobile
          path: |
            artifacts/tiny-kingdom-w276/
            test-results/
          retention-days: 7
