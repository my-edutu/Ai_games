name: Tiny Kingdom W423 Original Grain Proof Running Game
on:
  pull_request:
    branches: [main]
    paths:
      - public/tiny-kingdom/index.html
      - scripts/tiny-kingdom-w423-grain-visible-strip-contract.cjs
      - scripts/tiny-kingdom-w424-living-farm-sky-contract.cjs
      - tests/browser/tiny-kingdom-w424-real-farm-sky.spec.cjs
      - tests/browser/tiny-kingdom-w423-visible-proof-strip.spec.cjs
      - .github/workflows/tiny-kingdom-w423-real-grain-proof.yml
  workflow_dispatch:
jobs:
  original-live-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Actual single-parcel evidence contract
        run: node scripts/tiny-kingdom-w423-grain-visible-strip-contract.cjs
      - name: W424 real crop geometry, sky and physical camera contract
        run: node scripts/tiny-kingdom-w424-living-farm-sky-contract.cjs
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Uncut real worker and responsive five-stage proof at 1024 and 390
        run: npx playwright test tests/browser/tiny-kingdom-w423-visible-proof-strip.spec.cjs --workers=1
        env:
          CI: '1'
      - name: W424 uncut actual farmer, cloud composition and 390px player input
        run: npx playwright test tests/browser/tiny-kingdom-w424-real-farm-sky.spec.cjs --workers=1
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w423-actual-original-grain-film
          path: |
            artifacts/tiny-kingdom-w423/
            artifacts/tiny-kingdom-w424/
            test-results/
          retention-days: 14
