name: Tiny Kingdom W268 Real Market Dock Sightline
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-w268-real-market-lens-contract.cjs'
      - '.github/workflows/tiny-kingdom-w268-real-market-lens.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w268-lens-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  original-shelves-camera:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Real physical receiving-shelf camera projection
        run: node scripts/tiny-kingdom-w268-real-market-lens-contract.cjs
      - run: npm run build
