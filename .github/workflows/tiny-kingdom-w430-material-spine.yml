name: Tiny Kingdom W430 Original Living District Material Spine
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w430-material-spine.test.cjs'
      - '.github/workflows/tiny-kingdom-w430-material-spine.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w430-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  original-material-and-workday:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Original road and live canopy material contract
        run: node --test tests/browser/tiny-kingdom-w430-material-spine.test.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Film real original 1024px and 390px game and untouched authority
        run: npx playwright test tests/browser/tiny-kingdom-w428-mobile-workday.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w430-original-material-workday
          path: |
            artifacts/tiny-kingdom-w428/
            test-results/
          if-no-files-found: warn
          retention-days: 14
