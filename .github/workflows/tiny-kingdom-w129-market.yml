name: Tiny Kingdom W129 Living Market District Evidence

on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-w106-market-court-contract.cjs'
      - 'scripts/tiny-kingdom-w129-lived-market-contract.cjs'
      - 'tests/browser/tiny-kingdom-w129-market-architecture.spec.cjs'
      - '.github/workflows/tiny-kingdom-w129-market.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiny-kingdom-w129-market-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  original-market-source:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: W129 actual stall roofs, source topology and preserved W106 geometry budget
        run: |
          node scripts/tiny-kingdom-w129-lived-market-contract.cjs
          node scripts/tiny-kingdom-w106-market-court-contract.cjs

  original-market-webgl:
    needs: original-market-source
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: W129 genuine WebGL 1024/390, four true stalls, navigation and 120-day replay
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CI: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w129-market-architecture.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w129-original-market-roofs-and-setts
          path: |
            artifacts/tiny-kingdom-w129-market/
            test-results/
          retention-days: 14
