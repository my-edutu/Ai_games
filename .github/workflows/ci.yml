name: Autonomous Games CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked toolchain
        run: npm ci --no-audit --no-fund
      - name: Build and test
        run: npm test
      - name: Snake stream host self-test
        run: npm run snake:stream:self-test
      - name: Maze stream host self-test
        run: npm run maze:stream:self-test
      - name: Ant Colony stream host self-test
        run: npm run ant:stream:self-test
      - name: Tower stream host self-test
        run: npm run tower:stream:self-test
      - name: Authoritative nondeterminism scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'Math\.random|Date\.now|new Date\(|setTimeout\(|setInterval\(' \
            games/autonomous-snake/src/rules \
            games/autonomous-snake/src/runtime \
            games/autonomous-snake/src/ai \
            games/autonomous-snake/src/generation \
            games/autonomous-snake/src/state \
            games/ai-maze-escape/src/rules \
            games/ai-maze-escape/src/runtime \
            games/ai-maze-escape/src/ai \
            games/ai-maze-escape/src/generation \
            games/ai-maze-escape/src/state \
            games/ai-ant-colony/src/rules \
            games/ai-ant-colony/src/runtime \
            games/ai-ant-colony/src/ai \
            games/ai-ant-colony/src/generation \
            games/ai-ant-colony/src/state \
            games/infinite-tower-climb/src/rules \
            games/infinite-tower-climb/src/runtime \
            games/infinite-tower-climb/src/ai \
            games/infinite-tower-climb/src/generation \
            games/infinite-tower-climb/src/state \
            games/infinite-tower-climb/src/physics \
            games/infinite-tower-climb/src/combat \
            games/infinite-tower-climb/src/progression \
            games/infinite-tower-climb/src/influence; then
            echo 'Forbidden ambient nondeterminism found in authoritative code.'
            exit 1
          fi
      - name: Generate Snake Phase 5 chaos evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase5
          npm run snake:phase5:chaos -- phase5-ci > artifacts/phase5/chaos-summary.json
      - name: Generate Maze Phase 5 chaos evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/maze-phase5
          npm run maze:phase5:chaos -- maze-phase5-ci > artifacts/maze-phase5/chaos-summary.json
      - name: Generate Ant Colony Phase 5 chaos evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ant-phase5
          npm run ant:phase5:chaos -- ant-phase5-ci > artifacts/ant-phase5/chaos-summary.json
      - name: Generate Tower Phase 5 chaos evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tower-phase5
          npm run tower:phase5:chaos -- tower-phase5-ci > artifacts/tower-phase5/chaos-summary.json
      - name: Generate Snake Phase 6 release validation evidence
        shell: bash
        env:
          CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase6
          npm run snake:phase6:validate > artifacts/phase6/release-validation.json
      - name: Generate Maze Phase 6 release validation evidence
        shell: bash
        env:
          CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/maze-phase6
          npm run maze:phase6:validate > artifacts/maze-phase6/release-validation.json
      - name: Generate Ant Colony Phase 6 release validation evidence
        shell: bash
        env:
          CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ant-phase6
          npm run ant:phase6:validate > artifacts/ant-phase6/release-validation.json
      - name: Generate Tower Phase 6 release validation evidence
        shell: bash
        env:
          CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/tower-phase6
          npm run tower:phase6:validate > artifacts/tower-phase6/release-validation.json
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser capture and layout verification
        run: npm run test:browser
      - name: Upload Snake Phase 3 capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-snake-phase3-capture
          path: artifacts/phase3
          if-no-files-found: error
          retention-days: 30
      - name: Upload Maze Phase 3 capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-maze-escape-phase3-capture
          path: artifacts/maze-phase3
          if-no-files-found: error
          retention-days: 30
      - name: Upload Ant Colony Phase 3 capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-ant-colony-phase3-capture
          path: artifacts/ant-phase3
          if-no-files-found: error
          retention-days: 30
      - name: Upload Tower Phase 3 capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infinite-tower-climb-phase3-capture
          path: artifacts/tower-phase3
          if-no-files-found: error
          retention-days: 30
      - name: Upload Snake Phase 5 operations evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-snake-phase5-operations
          path: artifacts/phase5
          if-no-files-found: error
          retention-days: 30
      - name: Upload Maze Phase 5 operations evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-maze-escape-phase5-operations
          path: artifacts/maze-phase5
          if-no-files-found: error
          retention-days: 30
      - name: Upload Ant Colony Phase 5 operations evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-ant-colony-phase5-operations
          path: artifacts/ant-phase5
          if-no-files-found: error
          retention-days: 30
      - name: Upload Tower Phase 5 operations evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infinite-tower-climb-phase5-operations
          path: artifacts/tower-phase5
          if-no-files-found: error
          retention-days: 30
      - name: Upload Snake Phase 6 release validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-snake-phase6-validation
          path: artifacts/phase6
          if-no-files-found: error
          retention-days: 30
      - name: Upload Maze Phase 6 release validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-maze-escape-phase6-validation
          path: artifacts/maze-phase6
          if-no-files-found: error
          retention-days: 30
      - name: Upload Ant Colony Phase 6 release validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-ant-colony-phase6-validation
          path: artifacts/ant-phase6
          if-no-files-found: error
          retention-days: 30
      - name: Upload Tower Phase 6 release validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infinite-tower-climb-phase6-validation
          path: artifacts/tower-phase6
          if-no-files-found: error
          retention-days: 30
