name: Eko Run Phase 4 Mainland Morning

on:
  push:
    branches:
      - main
      - 'agent/eko-run-phase4'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mainland-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked toolchain
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Phase 4 vertical slice tests
        run: node --test tests/phase4/eko-run-*.test.cjs
      - name: Phase 3 regression tests
        run: node --test tests/phase3/eko-run-*.test.cjs
      - name: Phase 2 regression tests
        run: node --test tests/phase2/eko-run-*.test.cjs
      - name: Phase 1 regression tests
        run: node --test tests/foundation/eko-run-*.test.cjs
      - name: Three authority boundary scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E "from ['\"]three['\"]|require\(['\"]three['\"]\)" \
            games/eko-street-run/src/config \
            games/eko-street-run/src/state \
            games/eko-street-run/src/runtime \
            games/eko-street-run/src/physics \
            games/eko-street-run/src/rules; then
            echo 'Three.js leaked into authoritative code.'
            exit 1
          fi
      - name: Phase 4 evidence
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence/eko-run/phase4/runtime
          node scripts/run-eko-run-phase4-evidence.cjs | tee evidence/eko-run/phase4/runtime/mainland-morning-summary.json
      - name: Upload Phase 4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: eko-run-phase4-evidence
          path: evidence/eko-run/phase4/runtime
          if-no-files-found: error
