name: Tiny Kingdom W366 Actual Civic Road GPU Growth
on:
  push:
    branches: [feat/tiny-kingdom-post-main-gauntlet-20261031]
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-w366-civic-road-gpu-harness.cjs'
      - '.github/workflows/tiny-kingdom-w366-civic-road-gpu.yml'
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-w366-civic-road-gpu-harness.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  civic-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Execute actual civic GPU growth, replacement and shrink
        run: node scripts/tiny-kingdom-w366-civic-road-gpu-harness.cjs
      - name: Parse original production Tiny Kingdom script
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('public/tiny-kingdom/index.html','utf8');
          const script=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].at(-1)?.[1];
          if(!script)throw Error('Missing actual game script');
          new vm.Script(script);
          console.log('W366 original playable JavaScript parses');
          NODE
