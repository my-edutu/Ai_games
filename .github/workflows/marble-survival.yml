name: Marble Survival Validation

on:
  push:
    branches:
      - main
      - 'agent/marble-survival-*'
    paths:
      - 'games/marble-survival-tournament/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/marble-survival.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'games/marble-survival-tournament/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/marble-survival.yml'

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked toolchain
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Marble authority tests
        run: npm run marble:test
      - name: Marble stream host self-test
        run: npm run marble:stream:self-test
      - name: Marble visual contract verification
        run: npm run marble:verify
      - name: Marble authoritative nondeterminism scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'Math\.random|Date\.now|new Date\(|setTimeout\(|setInterval\(' \
            games/marble-survival-tournament/src/state \
            games/marble-survival-tournament/src/runtime \
            games/marble-survival-tournament/src/physics \
            games/marble-survival-tournament/src/rules \
            games/marble-survival-tournament/src/generation; then
            echo 'Forbidden ambient nondeterminism found in Marble authority.'
            exit 1
          fi
