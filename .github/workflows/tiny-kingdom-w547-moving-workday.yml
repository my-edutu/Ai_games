name: Tiny Kingdom W547 Real Unpaused Workday and 390px Evidence
on:
  workflow_dispatch:
  push:
    branches: [feat/tiny-kingdom-post-main-gauntlet-20261031]
    paths:
      - public/tiny-kingdom/index.html
      - tests/browser/tiny-kingdom-w547-original-moving-workday.spec.cjs
      - .github/workflows/tiny-kingdom-w547-moving-workday.yml
jobs:
  original-moving-software-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Unpaused original 390px and desktop workday and CPU/driver frame evidence
        run: npx playwright test tests/browser/tiny-kingdom-w547-original-moving-workday.spec.cjs --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w547-unpaused-actual-game
          path: |
            artifacts/tiny-kingdom-w547/
            test-results/
          retention-days: 14
          if-no-files-found: warn
