name: Tiny Kingdom W388 Genuine Receiving-to-Market Passage
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w388-real-market-passage.spec.cjs'
      - '.github/workflows/tiny-kingdom-w388-real-market-passage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w388-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  real-receiving-passage:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Original WebGL receiving passage desktop and mobile
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w388-real-market-passage.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w388-authentic-market-passage
          path: |
            artifacts/tiny-kingdom-w388-route/
            test-results/
          retention-days: 14
