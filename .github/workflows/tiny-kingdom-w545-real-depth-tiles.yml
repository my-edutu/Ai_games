name: Tiny Kingdom W545 Original Depth-Tile Actual Pixels
on:
  push:
    branches: [feat/tiny-kingdom-post-main-gauntlet-20261031]
    paths:
      - public/tiny-kingdom/index.html
      - tests/browser/tiny-kingdom-w545-static-depth-tile.spec.cjs
      - tests/browser/tiny-kingdom-w545-real-depth-tiles.spec.cjs
      - .github/workflows/tiny-kingdom-w545-real-depth-tiles.yml
  pull_request:
    branches: [main]
    paths:
      - public/tiny-kingdom/index.html
      - tests/browser/tiny-kingdom-w545-static-depth-tile.spec.cjs
      - tests/browser/tiny-kingdom-w545-real-depth-tiles.spec.cjs
      - .github/workflows/tiny-kingdom-w545-real-depth-tiles.yml
  workflow_dispatch:
jobs:
  actual-static-depth-pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Validate conservative exact-source occlusion and actual 390px unchanged pixels
        run: npx playwright test tests/browser/tiny-kingdom-w545-static-depth-tile.spec.cjs tests/browser/tiny-kingdom-w545-real-depth-tiles.spec.cjs --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w545-original-real-pixels
          path: |
            artifacts/tiny-kingdom-w545/
            test-results/
          retention-days: 14
          if-no-files-found: warn
