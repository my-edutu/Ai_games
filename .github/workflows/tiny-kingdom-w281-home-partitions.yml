name: Tiny Kingdom W281 Original Housing Dirty-Region Spine
on:
  pull_request:
    branches: [main]
    paths:
      - public/tiny-kingdom/index.html
      - tests/browser/tiny-kingdom-w281-home-partitions.spec.cjs
      - tests/browser/tiny-kingdom-w357-roadside-groundscape.spec.cjs
      - scripts/tiny-kingdom-w332-noncontact-gpu-skin-contract.cjs
      - scripts/tiny-kingdom-w333-portrait-worker-core-camera-contract.cjs
      - scripts/tiny-kingdom-w334-physical-portrait-witness-contract.cjs
      - scripts/tiny-kingdom-w335-authentic-portrait-handoff-and-supply-contract.cjs
      - scripts/tiny-kingdom-w337-physical-workday-gate-contract.cjs
      - scripts/tiny-kingdom-w315-growth-residency-contract.cjs
      - scripts/tiny-kingdom-w316-civic-core-residency-contract.cjs
      - scripts/tiny-kingdom-w317-true-core-gpu-residency-contract.cjs
      - scripts/tiny-kingdom-w318-civic-gpu-allocation-fallback-contract.cjs
      - scripts/tiny-kingdom-w319-civic-road-buffer-reuse-contract.cjs
      - scripts/tiny-kingdom-w320-cooperative-simulation-contract.cjs
      - scripts/tiny-kingdom-w321-input-fair-simulation-contract.cjs
      - scripts/tiny-kingdom-w323-gpu-timer-scene-contract.cjs
      - scripts/tiny-kingdom-w324-rig-camera-cache-contract.cjs
      - scripts/tiny-kingdom-w325-real-grain-headroom-contract.cjs
      - scripts/tiny-kingdom-w326-original-field-row-residency-contract.cjs
      - scripts/tiny-kingdom-w338-original-farm-draw-batching-contract.cjs
      - scripts/tiny-kingdom-w342-original-open-gateway-parity-contract.cjs
      - scripts/tiny-kingdom-w343-foreground-workday-pose-reuse-contract.cjs
      - scripts/tiny-kingdom-w344-original-ground-atlas-spine-contract.cjs
      - scripts/tiny-kingdom-w345-founding-streetfront-residency-contract.cjs
      - scripts/tiny-kingdom-w347-genuine-workday-ledger-occlusion-contract.cjs
      - scripts/tiny-kingdom-w349-occupied-casement-contract.cjs
      - scripts/tiny-kingdom-w350-city-topology-contract.cjs
      - scripts/tiny-kingdom-w351-real-home-lanes-contract.cjs
      - scripts/tiny-kingdom-w353-workday-grain-contract.cjs
      - scripts/tiny-kingdom-w355-real-farm-lens-contract.cjs
      - scripts/tiny-kingdom-w356-real-home-albedo-contract.cjs
      - scripts/tiny-kingdom-w327-original-woodland-work-corridor-contract.cjs
      - scripts/tiny-kingdom-w328-original-trading-roof-and-harvest-stooks-contract.cjs
      - scripts/tiny-kingdom-w265-growth-civic-contract.cjs
      - .github/workflows/tiny-kingdom-w281-home-partitions.yml
  workflow_dispatch:
jobs:
  original-house-dirty-regions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: W315 actual civic-route dependency + original growth source contracts
        run: |
          node scripts/tiny-kingdom-w332-noncontact-gpu-skin-contract.cjs
          node scripts/tiny-kingdom-w333-portrait-worker-core-camera-contract.cjs
          node scripts/tiny-kingdom-w334-physical-portrait-witness-contract.cjs
          node scripts/tiny-kingdom-w335-authentic-portrait-handoff-and-supply-contract.cjs
          node scripts/tiny-kingdom-w337-physical-workday-gate-contract.cjs
          node scripts/tiny-kingdom-w315-growth-residency-contract.cjs
          node scripts/tiny-kingdom-w316-civic-core-residency-contract.cjs
          node scripts/tiny-kingdom-w317-true-core-gpu-residency-contract.cjs
          node scripts/tiny-kingdom-w318-civic-gpu-allocation-fallback-contract.cjs
          node scripts/tiny-kingdom-w319-civic-road-buffer-reuse-contract.cjs
          node scripts/tiny-kingdom-w320-cooperative-simulation-contract.cjs
          node scripts/tiny-kingdom-w321-input-fair-simulation-contract.cjs
          node scripts/tiny-kingdom-w323-gpu-timer-scene-contract.cjs
          node scripts/tiny-kingdom-w324-rig-camera-cache-contract.cjs
          node scripts/tiny-kingdom-w325-real-grain-headroom-contract.cjs
          node scripts/tiny-kingdom-w326-original-field-row-residency-contract.cjs
          node scripts/tiny-kingdom-w338-original-farm-draw-batching-contract.cjs
          node scripts/tiny-kingdom-w342-original-open-gateway-parity-contract.cjs
          node scripts/tiny-kingdom-w343-foreground-workday-pose-reuse-contract.cjs
          node scripts/tiny-kingdom-w344-original-ground-atlas-spine-contract.cjs
          node scripts/tiny-kingdom-w345-founding-streetfront-residency-contract.cjs
          node scripts/tiny-kingdom-w347-genuine-workday-ledger-occlusion-contract.cjs
          node scripts/tiny-kingdom-w348-real-granary-frontage-contract.cjs
          node scripts/tiny-kingdom-w349-occupied-casement-contract.cjs
          node scripts/tiny-kingdom-w350-city-topology-contract.cjs
          node scripts/tiny-kingdom-w351-real-home-lanes-contract.cjs
          node scripts/tiny-kingdom-w353-workday-grain-contract.cjs
          node scripts/tiny-kingdom-w355-real-farm-lens-contract.cjs
          node scripts/tiny-kingdom-w356-real-home-albedo-contract.cjs
          node scripts/tiny-kingdom-w327-original-woodland-work-corridor-contract.cjs
          node scripts/tiny-kingdom-w328-original-trading-roof-and-harvest-stooks-contract.cjs
          node scripts/tiny-kingdom-w305-arcade-material-contract.cjs
          node scripts/tiny-kingdom-w265-growth-civic-contract.cjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/tiny-kingdom-w281-home-partitions.spec.cjs tests/browser/tiny-kingdom-w357-roadside-groundscape.spec.cjs --workers=1
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w281-original-housing
          path: |
            artifacts/tiny-kingdom-w281/
            artifacts/tiny-kingdom-w357/
            test-results/
          retention-days: 14
