name: AI Battle Royale CC0 Character Import
on:
  push:
    branches:
      - gauntlet/battle-royale-3d-broadcast-v1
    paths:
      - scripts/import-battle-cc0-character.cjs
      - .github/workflows/battle-royale-cc0-character-import.yml
permissions:
  contents: write
jobs:
  import-pinned-character:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch, verify and vendor original CC0 skinned human
        run: node scripts/import-battle-cc0-character.cjs
      - name: Commit verified GLB and upstream license to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ai-battle-royale/models/
          if git diff --cached --quiet; then
            echo "Pinned assets already present; skipping"
            exit 0
          fi
          git commit -m "asset(battle): vendor checksum-verified CC0 skinned humanoid and license"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
