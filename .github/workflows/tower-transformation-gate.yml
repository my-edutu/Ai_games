name: Tower Transformation Quality Contract
on:
  push:
    branches:
      - feat/tower-transformation-gauntlet-20261101
    # Source/test edits must still receive an exact-code veto. Evidence-journal
    # commits change no shipped game and must not add runners to the already
    # backlogged Actions queue. Keep manual exact-SHA dispatch available.
    paths:
      - .github/workflows/tower-transformation-gate.yml
      - .github/workflows/tower-transformation-visual-evidence.yml
      - package.json
      - package-lock.json
      - playwright.tower.config.cjs
      - games/infinite-tower-climb/**
      - packages/**
      - public/infinite-tower-climb/**
      - '!public/infinite-tower-climb/gauntlet/transformation.json'
      - '!public/infinite-tower-climb/gauntlet/progress.json'
      - scripts/tower-*
      - tests/phase*/tower-*
      - tests/browser/tower-*
  workflow_dispatch:
permissions:
  contents: read
# P0 runner admission: this is the latest-source SAFETY VETO, not an
# immutable baseline/candidate film. Multiple PR68 hourly source updates had
# left separate exact-SHA quality jobs pending without runners. GitHub retains
# at most one PENDING quality run per branch group and replaces an older pending
# one with a newer HEAD; do not interrupt a job which is actually running.
# The separate 9-job real-game capture keeps its immutable per-SHA group.
concurrency:
  group: tower-transformation-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrity-not-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test transformation verdict gate
        run: node --test tests/phase3/tower-transformation-acceptance.test.cjs
      - name: Veto missing or divergent original same-run guardian/crusher-to-restart evidence
        shell: bash
        run: |
          set -euo pipefail
          dir=artifacts/tower-source-chain
          mkdir -p "$dir"
          git rev-parse HEAD > "$dir/source-sha.txt"
          for replay in 1 2; do
            node scripts/tower-guardian-source-witness.cjs > "$dir/replay-${replay}.json" 2>"$dir/replay-${replay}.stderr"
          done
          node scripts/tower-campaign-audit.cjs "$dir/replay-1.json" "$dir/replay-2.json" "$dir/audit.json" "$(git rev-parse HEAD)"
      - name: Preserve ungraded exact-source guardian/game-loop chain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-source-chain-${{ github.sha }}
          path: artifacts/tower-source-chain/
          retention-days: 7
      - name: Verify Tower authority (guardrail only)
        run: npm run tower:stream:self-test
      # The source-only contract already completed while GitHub's Ubuntu
      # apt mirror intermittently failed to resolve Chromium font packages.
      # Probe the actual installed browser and WebGL2 directly instead.
      - name: Install and probe Chromium / WebGL2 without apt
        run: |
          npx playwright install chromium
          node scripts/tower-chromium-host-preflight.cjs
      - name: Verify actual desktop/phone HUD outcome-to-restart continuity
        run: npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-hud.spec.cjs
      - name: Verify progress page truthfulness at desktop and phone widths
        run: npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-transformation-progress.spec.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tower-transformation-integrity-failure
          path: test-results/
          retention-days: 7
  # Full catalogue regression remains a VETO. The previous combined runner
  # was externally shut down at test #616 even after phase isolation.
  # Give each COMPLETE test file exactly one bounded independent runner:
  # foundation, phase2, phase4-6 plus four disjoint phase3 partitions.
  # A missing file, empty shard, test failure or runner termination fails CI.
  # This is not a substitute for original video or hardware acceptance.
  catalogue-guardrail:
    name: catalogue-guardrail (${{ matrix.phase }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {phase: foundation, shard: 0, shards: 1}
          - {phase: phase2, shard: 0, shards: 1}
          - {phase: phase3, shard: 0, shards: 4}
          - {phase: phase3, shard: 1, shards: 4}
          - {phase: phase3, shard: 2, shards: 4}
          - {phase: phase3, shard: 3, shards: 4}
          - {phase: phase4, shard: 0, shards: 1}
          - {phase: phase5, shard: 0, shards: 1}
          - {phase: phase6, shard: 0, shards: 1}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build actual repository for exact-source test contracts
        run: npm run build
      - name: Execute the complete non-overlapping test-file partition
        shell: bash
        env:
          TEST_PHASE: ${{ matrix.phase }}
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARDS: ${{ matrix.shards }}
        run: |
          set -euo pipefail
          mapfile -d '' -t all_files < <(find "tests/$TEST_PHASE" -maxdepth 1 -type f -name '*.test.cjs' -print0 | sort -z)
          if (( ${#all_files[@]} < TEST_SHARDS )); then
            echo "::error::The phase has fewer test files than shards; no silent skipped tests"
            exit 1
          fi
          selected=()
          for i in "${!all_files[@]}"; do
            if (( i % TEST_SHARDS == TEST_SHARD )); then
              selected+=("${all_files[i]}")
            fi
          done
          if (( ${#selected[@]} == 0 )); then
            echo "::error::An empty test shard is a failed catalogue guardrail"
            exit 1
          fi
          printf 'Exact SHA: %s, phase: %s, partition: %s/%s, files: %s of %s\n' \
            "$GITHUB_SHA" "$TEST_PHASE" "$TEST_SHARD" "$TEST_SHARDS" \
            "${#selected[@]}" "${#all_files[@]}"
          printf '%s\n' "${selected[@]}"
          # Never background, mask failure, skip a failing file, or count test
          # outputs as gameplay acceptance. GitHub's job conclusion is veto.
          timeout --signal=TERM --kill-after=5s 210s \
            node --test --test-concurrency=2 "${selected[@]}"
