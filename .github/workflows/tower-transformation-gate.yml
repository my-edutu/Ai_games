name: Tower Transformation Quality Contract
on:
  push:
    branches:
      - feat/tower-transformation-gauntlet-20261101
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tower-transformation-${{ github.sha }}
  cancel-in-progress: false
jobs:
  integrity-not-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test transformation verdict gate
        run: node --test tests/phase3/tower-transformation-acceptance.test.cjs
      - name: Observe actual 3200-tick guardian survival, pickups and progress (not quality)
        run: |
          mkdir -p artifacts/tower-source-chain
          git rev-parse HEAD > artifacts/tower-source-chain/source-sha.txt
          node scripts/tower-guardian-source-witness.cjs | tee artifacts/tower-source-chain/causal-witness.json
      - name: Preserve ungraded exact-source guardian/game-loop chain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-source-chain-${{ github.sha }}
          path: artifacts/tower-source-chain/
          retention-days: 7
      - name: Verify full repository logic (guardrail only)
        run: npm test
      - name: Verify Tower authority (guardrail only)
        run: npm run tower:stream:self-test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify actual desktop/phone HUD outcome-to-restart continuity
        run: npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-hud.spec.cjs
      - name: Verify progress page truthfulness at desktop and phone widths
        run: npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-transformation-progress.spec.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tower-transformation-integrity-failure
          path: test-results/
          retention-days: 7
