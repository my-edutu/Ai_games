name: Tower Transformation Quality Contract
on:
  push:
    branches:
      - feat/tower-transformation-gauntlet-20261101
    # Source/test edits must still receive an exact-code veto. Evidence-journal
    # commits change no shipped game and must not add runners to the already
    # backlogged Actions queue. Keep manual exact-SHA dispatch available.
    paths:
      - .github/workflows/tower-transformation-gate.yml
      - .github/workflows/tower-transformation-visual-evidence.yml
      - package.json
      - package-lock.json
      - playwright.tower.config.cjs
      - games/infinite-tower-climb/**
      - packages/**
      - public/infinite-tower-climb/**
      - '!public/infinite-tower-climb/gauntlet/transformation.json'
      - '!public/infinite-tower-climb/gauntlet/progress.json'
      - scripts/tower-*
      - tests/phase*/tower-*
      - tests/browser/tower-*
  workflow_dispatch:
permissions:
  contents: read
# P0 runner admission: this is the latest-source SAFETY VETO, not an
# immutable baseline/candidate film. Multiple PR68 hourly source updates had
# left separate exact-SHA quality jobs pending without runners. GitHub retains
# at most one PENDING quality run per branch group and replaces an older pending
# one with a newer HEAD; do not interrupt a job which is actually running.
# The separate 9-job real-game capture keeps its immutable per-SHA group.
concurrency:
  group: tower-transformation-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrity-not-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test transformation verdict gate
        run: node --test tests/phase3/tower-transformation-acceptance.test.cjs
      - name: Veto missing or divergent original same-run guardian/crusher-to-restart evidence
        shell: bash
        run: |
          set -euo pipefail
          dir=artifacts/tower-source-chain
          mkdir -p "$dir"
          git rev-parse HEAD > "$dir/source-sha.txt"
          for replay in 1 2; do
            node scripts/tower-guardian-source-witness.cjs > "$dir/replay-${replay}.json" 2>"$dir/replay-${replay}.stderr"
          done
          node scripts/tower-campaign-audit.cjs "$dir/replay-1.json" "$dir/replay-2.json" "$dir/audit.json" "$(git rev-parse HEAD)"
      - name: Preserve ungraded exact-source guardian/game-loop chain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-source-chain-${{ github.sha }}
          path: artifacts/tower-source-chain/
          retention-days: 7
      - name: Verify full repository logic (guardrail only)
        run: npm test
      - name: Verify Tower authority (guardrail only)
        run: npm run tower:stream:self-test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify actual desktop/phone HUD outcome-to-restart continuity
        run: npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-hud.spec.cjs
      - name: Verify progress page truthfulness at desktop and phone widths
        run: npx playwright test --config=playwright.tower.config.cjs tests/browser/tower-transformation-progress.spec.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tower-transformation-integrity-failure
          path: test-results/
          retention-days: 7
