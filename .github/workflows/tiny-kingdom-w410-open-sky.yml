name: Tiny Kingdom W410 Real Open-Sky Exchange Gameplay
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w410-open-sky-exchange.spec.cjs'
      - 'tests/browser/tiny-kingdom-w410-exchange-film.spec.cjs'
      - '.github/workflows/tiny-kingdom-w410-open-sky.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w410-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  actual-open-sky-market:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: RED/GREEN structural geometry and exact physical camera contract
        run: node --test tests/browser/tiny-kingdom-w410-open-sky-exchange.spec.cjs tests/browser/tiny-kingdom-w409-exchange-loggia.spec.cjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Record actual bartering and 1024px/390px physical closeups
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CI: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w410-exchange-film.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w410-actual-open-sky-market
          path: artifacts/tiny-kingdom-w410/
          if-no-files-found: warn
          retention-days: 14
