name: Tiny Kingdom W368 Authentic Grain Watch
on:
  pull_request:
    branches: [main]
    paths:
      - public/tiny-kingdom/index.html
      - scripts/tiny-kingdom-w368-authentic-grain-watch-contract.cjs
      - scripts/tiny-kingdom-w370-grain-workday-camera-contract.cjs
      - scripts/tiny-kingdom-w371-grain-wrist-camera-contract.cjs
      - tests/browser/tiny-kingdom-w368-authentic-grain-watch.spec.cjs
      - .github/workflows/tiny-kingdom-w368-authentic-grain-watch.yml
  workflow_dispatch:
jobs:
  real-grain-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Real player-facing original food-chain documentary contract
        run: node scripts/tiny-kingdom-w368-authentic-grain-watch-contract.cjs
      - name: W370 original grain labor physical-camera RED/GREEN contract
        run: node scripts/tiny-kingdom-w370-grain-workday-camera-contract.cjs
      - name: W371 actual crop-eye bound and witness selection contract
        run: node scripts/tiny-kingdom-w371-grain-wrist-camera-contract.cjs
      - run: npm ci
      # Shared Playwright config starts four original stream servers from dist.
      # Without a compilation step the live-game capture aborts before launch.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Actual original desktop and 390px live-game grain camera
        run: npx playwright test tests/browser/tiny-kingdom-w368-authentic-grain-watch.spec.cjs --workers=1
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w368-real-grain-workday-view
          path: |
            artifacts/tiny-kingdom-w368-authentic-watch/
            test-results/
          retention-days: 14
