name: Tiny Kingdom W519 Physical Camera Across Genuine Town Growth
on:
  push:
    branches: [feat/tiny-kingdom-post-main-gauntlet-20261031]
    paths:
      - public/tiny-kingdom/index.html
      - tests/browser/tiny-kingdom-w519-growing-camera.spec.cjs
      - .github/workflows/tiny-kingdom-w519-growing-camera.yml
  pull_request:
    branches: [main]
    paths:
      - public/tiny-kingdom/index.html
      - tests/browser/tiny-kingdom-w519-growing-camera.spec.cjs
      - .github/workflows/tiny-kingdom-w519-growing-camera.yml
  workflow_dispatch:
jobs:
  physical-camera-with-real-construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Source syntax and exact growth-camera contract
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('public/tiny-kingdom/index.html','utf8');
          const js=html.match(/<script>([\s\S]*?)<\/script>/);
          assert.ok(js);new Function(js[1]);
          assert.match(html,/function recoverGrowingTownSpectatorCamera\(/);
          assert.match(html,/function getGrowingTownCameraAudit\(/);
          assert.match(html,/recoverGrowingTownSpectatorCamera\(\);\nconst frameStaticStart/);
          NODE
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Film real Day1 to Day121 roof clearance on desktop and portrait
        run: npx playwright test tests/browser/tiny-kingdom-w519-growing-camera.spec.cjs --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w519-physical-camera-real-construction
          path: |
            test-results/
            playwright-report/
            artifacts/tiny-kingdom-w520-court-camera/
          if-no-files-found: warn
          retention-days: 14
