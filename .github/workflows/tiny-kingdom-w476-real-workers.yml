name: Tiny Kingdom W476 Real Work Visibility
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w476-real-workers.test.cjs'
      - 'tests/browser/tiny-kingdom-w476-real-workers.spec.cjs'
      - '.github/workflows/tiny-kingdom-w476-real-workers.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w476-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  real-worker-beacons:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Original real-work source contract
        run: node --test tests/browser/tiny-kingdom-w476-real-workers.test.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: True desktop and portrait running game, no fabricated work
        run: npx playwright test tests/browser/tiny-kingdom-w476-real-workers.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w476-actual-workers
          path: |
            artifacts/tiny-kingdom-w476/
            test-results/
          if-no-files-found: warn
          retention-days: 14
