name: Tiny Kingdom W471 Same-World Resident Actor Renderer
on:
  push:
    branches: [feat/tiny-kingdom-post-main-gauntlet-20261031]
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-w471-actor-spine-contract.cjs'
      - 'scripts/tiny-kingdom-w493-authentic-software-projection.cjs'
      - 'tests/browser/tiny-kingdom-w471-actor-spine.spec.cjs'
      - '.github/workflows/tiny-kingdom-w471-actor-spine.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w471-${{ github.ref }}
  cancel-in-progress: false
jobs:
  same-world-real-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/tiny-kingdom-w471-actor-spine-contract.cjs
      - name: W493 authentic visible-worker projection and strict CPU fallback
        run: node scripts/tiny-kingdom-w493-authentic-software-projection.cjs
      - run: npm run build
      - run: npx playwright install chromium
      - run: npx playwright test tests/browser/tiny-kingdom-w471-actor-spine.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w471-same-world-software-3d
          path: |
            artifacts/tiny-kingdom-w471/
            test-results/
          if-no-files-found: warn
          retention-days: 14
