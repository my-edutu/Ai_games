name: Tiny Kingdom W549 Actual Mobile Market Worker Sightline
on:
  workflow_dispatch:
  push:
    branches: [feat/tiny-kingdom-post-main-gauntlet-20261031]
    paths:
      - public/tiny-kingdom/index.html
      - tests/browser/tiny-kingdom-w549-physical-worker.spec.cjs
      - .github/workflows/tiny-kingdom-w549-physical-worker.yml
jobs:
  original-physical-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real unpaused 390px and desktop original worker post-aware recording
        run: npx playwright test tests/browser/tiny-kingdom-w549-physical-worker.spec.cjs --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-kingdom-w549-real-worker-camera
          path: |
            artifacts/tiny-kingdom-w549/
            test-results/
          retention-days: 14
          if-no-files-found: warn
