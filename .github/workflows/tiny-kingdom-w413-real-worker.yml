name: Tiny Kingdom W413 Actual Selected Worksite GPU Rig
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w413-observed-workskin.spec.cjs'
      - 'tests/browser/tiny-kingdom-w413-observed-worksite-runtime.spec.cjs'
      - '.github/workflows/tiny-kingdom-w413-real-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w413-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  selected-real-worker:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify active original worksite and excluded real contacts
        run: node --test tests/browser/tiny-kingdom-w413-observed-workskin.spec.cjs
      - name: W421 original medieval market and retained materials contract
        run: node scripts/tiny-kingdom-w421-architectural-contract.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Record real 1024px and 390px followed original worker (software GL diagnostic only)
        run: npx playwright test tests/browser/tiny-kingdom-w413-observed-worksite-runtime.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w413-selected-authentic-physical-workday
          path: |
            artifacts/tiny-kingdom-w413/
            test-results/
          if-no-files-found: warn
          retention-days: 14
