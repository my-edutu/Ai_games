name: Tiny Kingdom W223-W224 Real Resting Body Pose Evidence
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-w223-resting-slices-contract.cjs'
      - 'scripts/tiny-kingdom-w224-staggered-rest-poses-contract.cjs'
      - '.github/workflows/tiny-kingdom-w223-resting-slices.yml'
      - 'tests/browser/tiny-kingdom-w118-resting-actor.spec.cjs'
  workflow_dispatch:
permissions:
  contents: read
# Do not cancel running captures when a later hourly source edit arrives.
concurrency:
  group: tiny-kingdom-w223-resting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  authentic-resting-residents:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: W223 original resident slices, source parse, layout and no-omission safety
        run: node scripts/tiny-kingdom-w223-resting-slices-contract.cjs && node scripts/tiny-kingdom-w224-staggered-rest-poses-contract.cjs
      - name: Build actual game
        run: npm run build
      - name: Install Chromium software WebGL to diagnose geometry
        run: npx playwright install --with-deps chromium
      - name: Record real 1024px and 390px resting town, original actor fallback and intact authority
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CI: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w118-resting-actor.spec.cjs --workers=1 --reporter=line
      - name: Preserve actual screenshots, GL failures and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w223-resting-original-gameplay
          path: |
            test-results/
          if-no-files-found: warn
          retention-days: 14
