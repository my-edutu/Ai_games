name: Tower 3D Gauntlet Visual Gate
on:
  push:
    branches: ['agent/infinite-tower-3d-gauntlet']
    paths:
      - 'public/infinite-tower-climb/**'
      - 'scripts/serve-tower-stream.cjs'
      - 'tests/browser/tower-3d-gauntlet.spec.cjs'
      - 'tests/browser/tower-volumetric.spec.cjs'
      - 'tests/browser/tower-biome-evidence.spec.cjs'
      - '.github/workflows/tower-3d-gauntlet.yml'
  pull_request:
    paths:
      - 'public/infinite-tower-climb/**'
      - 'scripts/serve-tower-stream.cjs'
      - 'tests/browser/tower-3d-gauntlet.spec.cjs'
concurrency:
  group: tower-3d-gauntlet-latest
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  webgl-visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Native THREE geometry tests
        run: node --test tests/foundation/tower-3d-art.test.cjs tests/foundation/tower-volumetric-core.test.cjs tests/foundation/tower-authored-asset.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Browser evidence — WebGL/AI state/fallback
        run: npx playwright test tests/browser/tower-3d-gauntlet.spec.cjs tests/browser/tower-volumetric.spec.cjs tests/browser/tower-biome-evidence.spec.cjs
      - name: Keep screenshots and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-3d-gauntlet-visual-evidence
          path: |
            artifacts/tower-phase3
            artifacts/tower-gauntlet-evidence
            test-results
          if-no-files-found: warn
          retention-days: 30
