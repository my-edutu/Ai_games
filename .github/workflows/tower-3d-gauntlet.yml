name: Tower 3D Gauntlet Visual Gate
on:
  pull_request:
    paths:
      - 'public/infinite-tower-climb/**'
      - 'scripts/serve-tower-stream.cjs'
      - 'scripts/tower-image-metrics.cjs'
      - 'tests/foundation/tower-*.test.cjs'
      - 'tests/browser/tower-*.spec.cjs'
      - '.github/workflows/tower-3d-gauntlet.yml'
  workflow_dispatch:
concurrency:
  group: tower-3d-gauntlet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  webgl-visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: WebGL boot smoke (diagnose before expensive captures)
        run: npx playwright test tests/browser/tower-startup-diagnostics.spec.cjs --workers=1
      - name: Browser evidence — WebGL/AI state/fallback
        run: npx playwright test tests/browser/tower-3d-gauntlet.spec.cjs tests/browser/tower-volumetric.spec.cjs tests/browser/tower-biome-evidence.spec.cjs tests/browser/tower-production-features.spec.cjs tests/browser/tower-visual-redesign.spec.cjs
      # Keep visual evidence available even if native geometry assertions fail.
      - name: Native THREE geometry tests
        if: ${{ !cancelled() }}
        run: node --test tests/foundation/tower-3d-art.test.cjs tests/foundation/tower-volumetric-core.test.cjs tests/foundation/tower-authored-asset.test.cjs tests/foundation/tower-geology-rope.test.cjs tests/foundation/tower-spectacle.test.cjs
      - name: Keep screenshots and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-3d-gauntlet-visual-evidence
          path: |
            artifacts/tower-phase3
            artifacts/tower-gauntlet-evidence
            artifacts/tower-gauntlet-ui
            test-results
          if-no-files-found: warn
          retention-days: 30
