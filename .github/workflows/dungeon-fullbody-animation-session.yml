name: AI Dungeon — Session 03 Full-Body Animation Evidence
on:
  push:
    branches:
      - feat/dungeon-fullbody-animation-session-20261108
  workflow_dispatch:
concurrency:
  group: dungeon-fullbody-animation-${{ github.ref }}
  # Protect expensive genuine source-rig desktop/mobile WebM capture from
  # rapid branch-scoped test/doc pushes. One running and at most one queued
  # run remain bounded by GitHub concurrency; never claim queued validation.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  native-rig-and-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify production original-rig ES modules parse before browser capture
        run: |
          node --check public/ai-dungeon/app.js
          node --check public/ai-dungeon/facing-plan.js
          node --check public/ai-dungeon/model-assets.js
          node --check public/ai-dungeon/full-body-animation-controller.js
          node --check public/ai-dungeon/native-rig-deformation-plan.js
          node --check tests/browser/dungeon-full-body-animation.spec.cjs
      - name: Verify genuine controller, clips, source bones and deterministic combat
        run: node --test tests/foundation/dungeon-original-knee-hinge.test.cjs tests/foundation/dungeon-source-foot-facing.test.cjs tests/foundation/dungeon-original-steep-swing-projection.test.cjs tests/foundation/dungeon-source-raf-pair.test.cjs tests/foundation/dungeon-expedition-locomotion.test.cjs tests/foundation/dungeon-full-body-animation-controller.test.cjs tests/foundation/dungeon-native-rig-deformation.test.cjs tests/foundation/dungeon-native-duel-performance.test.cjs tests/foundation/dungeon-grounded-performance.test.cjs tests/foundation/dungeon-evasion-performance.test.cjs tests/foundation/dungeon-fabric-drape.test.cjs tests/foundation/dungeon-rig-attachments.test.cjs tests/foundation/dungeon-m1-native-continuity.test.cjs
      - name: Deterministic authoritative dungeon campaign
        run: npm run dungeon:gauntlet
      - run: npm run dungeon:assets:strict
      - run: npx playwright install chromium
      - name: Capture real imported rig travel, combat, skin and defeat
        run: npx playwright test -c tests/browser/dungeon.playwright.config.cjs tests/browser/dungeon-full-body-animation.spec.cjs tests/browser/dungeon-authored-motion.spec.cjs tests/browser/dungeon-rig-attachments.spec.cjs tests/browser/dungeon-fabric-drape.spec.cjs tests/browser/dungeon-endgame-epilogue.spec.cjs
        env:
          DUNGEON_REQUIRE_MODELS: '1'
      - name: Preserve authentic screenshots, video, JSON and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-session-03-source-rig-${{ github.sha }}
          path: |
            artifacts/dungeon-full-body-*
            artifacts/dungeon-*
            test-results/**
            evidence/dungeon/gauntlet-latest.json
          if-no-files-found: warn
          retention-days: 14

  original-journey:
    # Distinct from isolated proof frames: unchanged DungeonRuntime.step()
    # drives authentic entry, ordinary combat, Warden, floor, defeat/restart.
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/foundation/dungeon-m1-ordered-feed.test.cjs
      - run: npm run dungeon:assets:strict
      - run: npx playwright install chromium
      - name: Capture unaltered complete gameplay with source rigs
        run: npx playwright test -c tests/browser/dungeon-m1-journey.playwright.config.cjs
        env:
          DUNGEON_REQUIRE_MODELS: '1'
          DUNGEON_M1_VIEWPORT: ${{ matrix.viewport }}
      - name: Preserve exact-sha original world, video and source-tick proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-session-03-organic-${{ matrix.viewport }}-${{ github.sha }}
          path: |
            artifacts/dungeon-m1-organic-journey-${{ matrix.viewport }}*
            test-results/**
          if-no-files-found: warn
          retention-days: 14
