name: Tiny Kingdom W440 Actual Living Market Quarter
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w440-trade-quarter.test.cjs'
      - 'tests/browser/tiny-kingdom-w440-trade-quarter.spec.cjs'
      - '.github/workflows/tiny-kingdom-w440-trade-quarter.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w440-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  real-market-home-district-3d-interactions:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --test tests/browser/tiny-kingdom-w440-trade-quarter.test.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/tiny-kingdom-w440-trade-quarter.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w440-original-lived-market-quarter
          path: |
            artifacts/tiny-kingdom-w440/
            test-results/
          if-no-files-found: warn
          retention-days: 14
