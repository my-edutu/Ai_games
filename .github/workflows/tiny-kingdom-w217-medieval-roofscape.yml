name: Tiny Kingdom W217 Genuine Medieval Roofscape Evidence
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-w217-hip-roof-contract.cjs'
      - 'tests/browser/tiny-kingdom-w217-medieval-roofscape.spec.cjs'
      - '.github/workflows/tiny-kingdom-w217-medieval-roofscape.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-roofscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin the actual triggering source, never a moving branch tip.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Original roof source contracts
        run: node scripts/tiny-kingdom-w217-hip-roof-contract.cjs
      - run: npx playwright install --with-deps chromium
      - name: Original inhabited roofs on desktop and mobile WebGL
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w217-medieval-roofscape.spec.cjs --workers=1 --reporter=line
      - name: Preserve original complete gameplay screenshots video and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w217-original-roofscape
          path: |
            artifacts/tiny-kingdom-w217/
            test-results/
          if-no-files-found: warn
          retention-days: 14
