name: Export branch source

on:
  push:
    branches:
      - agent/ai-escape-room-all-phases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export source tree
        uses: actions/upload-artifact@v4
        with:
          name: ai-escape-room-source-${{ github.sha }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
