name: Tiny Kingdom W262 Genuine Market Cache and Portrait Receiving
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w262-real-economy-portrait.spec.cjs'
      - '.github/workflows/tiny-kingdom-w262-market-receiving.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w262-receiving-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  authentic-economy-and-physical-portrait:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Source and actual 390px WebGL real economy contract
        env:
          CI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w262-real-economy-portrait.spec.cjs --workers=1
      - name: Preserve actual mobile inventory and page/GL checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w262-real-cache-and-receiving
          path: |
            artifacts/tiny-kingdom-w262/
            test-results/
          if-no-files-found: warn
          retention-days: 14
