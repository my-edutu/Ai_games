# W232 runner-network recovery: installing Ubuntu apt packages via Playwright
# fails when GitHub's Ubuntu mirrors cannot resolve (2026-11-11 W231).
# Download the Chromium browser without rerunning apt on each parallel job.
# This is NOT a rendering or gameplay acceptance, and requires browser proof.
name: Tiny Kingdom W228 Original Living-World Dock Evidence
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w228-world-ui.spec.cjs'
      - '.github/workflows/tiny-kingdom-w228-world-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w228-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  running-world-desktop-and-mobile:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install chromium
      - name: Genuine playable world, preserved controls and uncut screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CI: '1'
        run: npx playwright test tests/browser/tiny-kingdom-w228-world-ui.spec.cjs --workers=1 --reporter=line
      - name: Preserve exact candidate desktop and 390px visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w228-world-ui
          path: test-results/w228-*
          if-no-files-found: warn
          retention-days: 14
