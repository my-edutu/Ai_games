name: Tiny Kingdom Long-Soak Evidence

on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-soak-evidence.cjs'
      - 'scripts/tiny-kingdom-w121-working-resident-contract.cjs'
      - 'scripts/tiny-kingdom-w122-worker-vbo-contract.cjs'
      - 'scripts/tiny-kingdom-w122-workday-supply-contract.cjs'
      - 'scripts/tiny-kingdom-w123-foreground-resident-contract.cjs'
      - 'scripts/tiny-kingdom-w118-resting-actor-contract.cjs'
      - '.github/workflows/tiny-kingdom-long-soak.yml'
  workflow_dispatch:

permissions:
  contents: read

# W105: an already-running exact-source evidence capture/soak must FINISH
# even when a later hourly commit arrives. Pending jobs can still be replaced;
# every artifact remains tied to its precise head SHA.
concurrency:
  group: tiny-kingdom-soak-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

# W115: Playwright 1.55 rejects GitHub ubuntu-latest (26.04); pin supported 24.04.
# Software-rendered captures do NOT establish physical GPU performance.
jobs:
  deterministic-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: W115 exact source GPU material residency contract
        run: node scripts/tiny-kingdom-w115-material-residency-contract.cjs
      - name: W116 original worker cart-to-wrist-to-receiving-shelf contract
        run: node scripts/tiny-kingdom-w116-real-market-handoff-contract.cjs
      - name: W117 true character and medieval geometry topology parity
        run: node scripts/tiny-kingdom-w117-primitive-parity-contract.cjs
      - name: W118 authentic stationary resident mesh and live-worker safety contract
        run: node scripts/tiny-kingdom-w118-resting-actor-contract.cjs
      - name: W119–W121 resident rendering and honest scene integrity
        run: |
          node scripts/tiny-kingdom-w119-real-commuter-contract.cjs
          node scripts/tiny-kingdom-w120-scene-integrity-contract.cjs
          node scripts/tiny-kingdom-w121-working-resident-contract.cjs
          node scripts/tiny-kingdom-w122-worker-vbo-contract.cjs
          node scripts/tiny-kingdom-w122-workday-supply-contract.cjs
          node scripts/tiny-kingdom-w123-foreground-resident-contract.cjs
      - run: npx playwright install --with-deps chromium
      - name: Real WebGL 120-day settlement and replay soak
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          TINY_KINGDOM_SOAK_DAYS: '120'
        run: node scripts/tiny-kingdom-soak-evidence.cjs
      - name: Publish evidence even when acceptance fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-long-soak
          path: artifacts/tiny-kingdom-soak/
          if-no-files-found: warn
          retention-days: 14
