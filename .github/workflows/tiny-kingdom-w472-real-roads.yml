name: Tiny Kingdom W472 Original Village Freight Road Rendering
on:
  push:
    branches: [feat/tiny-kingdom-post-main-gauntlet-20261031]
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'scripts/tiny-kingdom-w472-real-roads-contract.cjs'
      - 'tests/browser/tiny-kingdom-w472-real-roads.spec.cjs'
      - '.github/workflows/tiny-kingdom-w472-real-roads.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w472-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-road-and-population:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/tiny-kingdom-w472-real-roads-contract.cjs
      - run: node --test scripts/tiny-kingdom-w473-shadow-atlas-contract.cjs
      - run: npm run build
      - run: npx playwright install chromium
      - run: npx playwright test tests/browser/tiny-kingdom-w472-real-roads.spec.cjs --workers=1 --reporter=line
      - run: npx playwright test tests/browser/tiny-kingdom-w473-solar-atlas.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w472-real-village-roads
          path: |
            artifacts/tiny-kingdom-w472/
            artifacts/tiny-kingdom-w473/
            test-results/
          if-no-files-found: warn
          retention-days: 14
