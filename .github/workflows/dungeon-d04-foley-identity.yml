name: D04 Isolated Foley Authenticity Checks
on:
  push:
    branches:
      - feat/dungeon-d04-combat-feedback-realism-20261108
    paths:
      - public/ai-dungeon/original-combat-foley.js
      - public/ai-dungeon/app.js
      - tests/browser/dungeon-d04-decoded-video-proof.cjs
      - public/ai-dungeon/physical-combat-feedback.js
      - scripts/serve-dungeon-stream.cjs
      - tests/foundation/dungeon-d04-*.test.cjs
      - tests/browser/dungeon-physical-feedback-preview.spec.cjs
      - tests/browser/dungeon-d04-av-evidence.cjs
      - tests/browser/dungeon-d04-real-feedback-observation.cjs
      - .github/workflows/dungeon-d04-foley-identity.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dungeon-d04-foley-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check public/ai-dungeon/original-combat-foley.js
      - run: |
          node --test \
            tests/foundation/dungeon-d04-av-capture-evidence.test.cjs \
            tests/foundation/dungeon-d04-capture-buffer-gate.test.cjs \
            tests/foundation/dungeon-d04-readback-decoder-proof.test.cjs \
            tests/foundation/dungeon-d04-same-window-av.test.cjs \
            tests/foundation/dungeon-d04-browser-source-parse.test.cjs \
            tests/foundation/dungeon-d04-host-chrome-ci.test.cjs \
            tests/foundation/dungeon-d04-real-feedback-observation.test.cjs \
            tests/foundation/dungeon-d04-original-foley-cue-identity.test.cjs \
            tests/foundation/dungeon-d04-strict-original-foley-provenance.test.cjs \
            tests/foundation/dungeon-d04-foley-cue-idempotency.test.cjs \
            tests/foundation/dungeon-d04-simultaneous-verified-impact-foley.test.cjs \
            tests/foundation/dungeon-d04-simultaneous-verified-swing-foley.test.cjs
      - run: npm run build
  real-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: SHA-verified CC0 GLB asset retrieval
        run: npm run dungeon:assets:strict
      - name: Install Playwright-owned video encoder (no browser or apt dependencies)
        run: npx playwright install ffmpeg
      - name: Verify preinstalled Chrome (no apt mirror fetch)
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Identify optional real-media decoders without apt network dependency
        run: |
          if command -v ffprobe >/dev/null && command -v ffmpeg >/dev/null; then
            ffprobe -version | head -1
            ffmpeg -version | head -1
            echo "D04 decoder: local ffprobe/ffmpeg present"
          else
            echo "::warning::D04 Decoder unavailable: raw browser gameplay/audio can still be captured; decoded frame and Opus evidence remain UNVERIFIED"
          fi
      - name: Real Dungeon runtime and WebGL smoke only; not sample-synchronized A/V proof
        run: npx playwright test -c tests/browser/dungeon-d04.playwright.config.cjs
        env:
          D04_BROWSER_CHANNEL: chrome
          DUNGEON_REQUIRE_MODELS: '1'
      - name: Publish authentic screenshot and source diagnostics if generated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d04-authentic-preview-smoke
          path: |
            artifacts/dungeon-d04-*
            test-results/**
          retention-days: 7
          if-no-files-found: warn
