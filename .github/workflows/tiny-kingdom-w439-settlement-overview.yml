name: Tiny Kingdom W439 Actual Growing City Overview
on:
  pull_request:
    paths:
      - 'public/tiny-kingdom/index.html'
      - 'tests/browser/tiny-kingdom-w439-settlement-overview.test.cjs'
      - 'tests/browser/tiny-kingdom-w439-settlement-overview.spec.cjs'
      - '.github/workflows/tiny-kingdom-w439-settlement-overview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-kingdom-w439-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  original-city-footprint-at-day1-day121:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/tiny-kingdom-post-main-gauntlet-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      CI: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --test tests/browser/tiny-kingdom-w439-settlement-overview.test.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/tiny-kingdom-w439-settlement-overview.spec.cjs --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-kingdom-w439-original-city-framing
          path: |
            artifacts/tiny-kingdom-w439/
            test-results/
          if-no-files-found: warn
          retention-days: 14
