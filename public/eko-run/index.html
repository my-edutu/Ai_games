<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101e28">
<title>Eko Run — The City Never Stops</title>
<style>
:root{color-scheme:dark;--ink:#f7f4e9;--muted:#aec3c7;--panel:rgba(12,31,42,.83);--gold:#ffcb5b;--line:rgba(235,248,247,.21)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#152933;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow:hidden}.shell{position:relative;width:100%;height:100dvh;min-height:380px;isolation:isolate}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vignette{pointer-events:none;position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,22,28,.32),transparent 40%),linear-gradient(0deg,rgba(5,17,24,.47),transparent 30%),linear-gradient(180deg,rgba(11,28,39,.40),transparent 28%);z-index:1}
.overlay{position:relative;z-index:2;pointer-events:none;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,2.5vw,30px);padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
header{display:flex;gap:20px;align-items:flex-start;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.brand-mark{display:grid;place-items:center;font-weight:1000;letter-spacing:-.08em;font-size:1.5rem;color:#112d37;background:var(--gold);width:46px;height:46px;border-radius:14px;transform:rotate(-7deg);box-shadow:0 8px 30px #0004}.brand h1{font-size:clamp(22px,3vw,35px);line-height:1;letter-spacing:-.045em;margin:0;font-weight:900}.brand small{font-size:10px;font-weight:800;letter-spacing:.23em;color:#ffe1a1}.topright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.pill{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);padding:10px 15px;border-radius:11px;font-size:11px;font-weight:850;letter-spacing:.12em}.pill strong{color:var(--gold)}#connection{color:#9ef4b5}#connection.lost{color:#ffc19c}
.middle{position:absolute;top:28%;left:50%;transform:translate(-50%,-50%);text-align:center;max-width:74vw;pointer-events:none}#event{font-size:clamp(18px,2.3vw,35px);letter-spacing:-.035em;font-weight:1000;color:#ffe49c;text-shadow:0 5px 22px #061e28;opacity:0}#event.pop{animation:pop 1.5s ease-out both}@keyframes pop{0%{transform:translateY(8px) scale(.92);opacity:0}16%{transform:translateY(0) scale(1.03);opacity:.94}42%{transform:translateY(-5px) scale(1);opacity:.74}100%{transform:translateY(-28px);opacity:0}}#banner{font-weight:1000;color:var(--gold);background:#152d38db;padding:20px 24px;border-radius:15px;font-size:clamp(16px,2.5vw,32px);border:1px solid #ffe19766}#banner[hidden]{display:none}
.bottombar{display:flex;flex-direction:column;gap:13px}.story{display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-weight:800;font-size:11px;letter-spacing:.24em;color:var(--gold)}.district{font-size:clamp(22px,4.2vw,56px);font-weight:950;line-height:1;letter-spacing:-.055em;margin:4px 0 5px;text-shadow:0 4px 20px #081f32}#detail{font-size:11px;font-weight:700;letter-spacing:.09em;color:#e7efe9}.scores{display:flex;gap:9px;align-items:end}.score{min-width:118px;background:var(--panel);border:1px solid var(--line);padding:13px 16px;border-radius:12px;backdrop-filter:blur(10px)}.score span{display:block;font-size:10px;letter-spacing:.13em;font-weight:800;color:var(--muted);margin-bottom:4px}.score strong{font-weight:950;font-size:clamp(18px,2.5vw,29px);letter-spacing:-.04em;white-space:nowrap}.score.gold strong{color:var(--gold)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:auto;background:rgba(9,26,34,.81);border:1px solid var(--line);padding:9px;border-radius:15px;backdrop-filter:blur(22px)}
button,select,.button{font:inherit;border:1px solid #597680;background:#1f3a45;color:white;border-radius:9px;min-height:38px;padding:10px 13px;font-size:11px;font-weight:900;letter-spacing:.07em;cursor:pointer;text-decoration:none}button:hover,select:hover,.button:hover{border-color:var(--gold);background:#285263}button:focus-visible,select:focus-visible,.button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.primary{background:var(--gold);color:#20343b;border-color:transparent}.spacer{flex:1}.hint{font-size:11px;color:#c4d3d5;margin-inline:8px}.touch{display:none;pointer-events:auto;gap:7px;justify-content:center}.autonomous .touch{display:none}.touch button{width:70px;height:50px;background:rgba(10,35,48,.90);border-radius:12px;font-size:12px;touch-action:none}.soft{font-size:11px;color:#d2e1df}#fallback{position:absolute;z-index:3;inset:0;background:#192d39;padding:40px;display:grid;place-items:center;text-align:center}#fallback[hidden]{display:none}
@media(max-width:860px){.brand{gap:9px}.brand small{white-space:nowrap;letter-spacing:.10em;font-size:8px}.brand h1{font-size:21px}.autonomous .touch{display:none}.overlay{padding:12px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(13px,env(safe-area-inset-bottom))}.story{align-items:start;flex-direction:column;gap:8px}.scores{width:100%;gap:7px}.score{min-width:0;flex:1;padding:8px 10px}.score strong{font-size:19px}.score span{font-size:8px}.hint{display:none}.touch{display:flex}.toolbar{justify-content:center}.toolbar button,.toolbar select,.toolbar .button{padding:8px;font-size:10px}.brand h1{font-size:22px}.brand-mark{width:36px;height:36px;font-size:20px}.topright .pill:last-child{display:none}.district{font-size:29px}#detail{font-size:9px}}
@media(max-height:550px){.touch{display:none}.score{padding:6px}.district{font-size:23px}.brand small{display:none}#event{display:none}}
@media(prefers-reduced-motion:reduce){#event.pop{animation:none}}
</style>
</head>
<body>
<div class="shell">
<canvas id="game" role="img" aria-label="Live 3D Lagos street runner simulation with Tayo navigating six districts"></canvas>
<div class="vignette"></div>
<main class="overlay">
<header>
<div class="brand"><div class="brand-mark">E!</div><div><small>THE CITY NEVER STOPS</small><h1>EKO RUN</h1></div></div>
<div class="topright"><div class="pill" id="connection" role="status">● CONNECTING</div><div class="pill"><strong id="cycle">CYCLE 01</strong> · <span id="fps">— FPS</span></div></div>
</header>
<div class="middle" aria-live="polite"><div id="event"></div><div id="banner" hidden></div></div>
<div class="bottombar">
<div class="story"><div><div class="eyebrow" id="signal">AI PILOT CONNECTING</div><div class="district" id="district">MAINLAND MORNING</div><div id="detail">LOADING AUTHORITATIVE SIMULATION…</div></div><div class="scores" aria-label="Run scoreboard"><div class="score"><span>DISTANCE</span><strong id="distance">0000 M</strong></div><div class="score gold"><span>EKO TOKENS</span><strong id="tokens">00</strong></div><div class="score"><span>RUN STATUS</span><strong id="state">STARTING</strong></div></div></div>
<div class="touch" aria-label="Touch controls"><button data-control="ArrowLeft" aria-label="Move left">◀</button><button data-control="ArrowRight" aria-label="Move right">▶</button><button data-control="Space" aria-label="Jump">JUMP</button><button data-control="ArrowDown" aria-label="Slide">SLIDE</button><button data-control="KeyV" aria-label="Vault">VAULT</button></div>
<div class="toolbar">
<button class="primary" id="mode" type="button">SWITCH TO PLAYER</button>
<label class="soft" for="outfit">TAYO OUTFIT</label><select id="outfit"><option value="lagos-streetwear">Streetwear</option><option value="yoruba-agbada-fila">Agbada</option><option value="igbo-isi-agu-red-cap">Isi Agu</option><option value="hausa-baban-riga-cap">Baban Riga</option></select>
<button id="quality" type="button">QUALITY HIGH</button><div class="spacer"></div>
<span class="hint">PLAYER: ← → MOVE · SPACE JUMP · ↓ SLIDE · V VAULT</span>
<a class="button" href="/eko/progress" target="_blank" rel="noopener">GAUNTLET PROGRESS ↗</a>
</div>
</div>
</main>
<div id="fallback" hidden role="alert"></div>
</div>
<script type="module" src="/eko/app.js"></script>
</body>
</html>
