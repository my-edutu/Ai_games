<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Infinite Tower Climb — Autonomous Ascent</title><link rel="stylesheet" href="/tower/styles.css"><link rel="stylesheet" href="/tower/ux-v2.css"></head>
<body data-ux-revision="2"><main id="app" class="tower-app" data-testid="tower-app">
<section class="world-stage" data-testid="shell"><canvas id="tower-canvas" data-testid="tower-canvas" aria-label="Infinite Tower Climb gameplay"></canvas>
<div class="game-hud" data-testid="game-hud">
<header class="broadcast-top" data-testid="hud"><div class="identity"><span class="eyebrow">AUTONOMOUS ASCENT</span><strong>INFINITE TOWER</strong></div><div class="sector"><span id="sector-name">FOUNDRY SECTOR</span><small id="camera-mode">ASCENT CAMERA</small></div><div class="floor-chip"><small>FLOOR</small><b id="floor" data-testid="floor">0</b></div><div class="height-chip"><small>HEIGHT</small><b id="height">0m</b></div></header>
<aside class="vitals"><div class="vital-row"><span>INTEGRITY</span><span id="health-text">--</span></div><div class="meter"><i id="health-meter"></i></div><div class="vital-row"><span>STAMINA</span><span id="stamina-text">--</span></div><div class="meter stamina"><i id="stamina-meter"></i></div><div class="shield-row"><span>SHIELDS</span><b id="shields">0</b></div></aside>
<section class="guardian-hud" id="guardian-hud" aria-hidden="true"><small>GUARDIAN CONTACT</small><div class="guardian-name">TOWER WARDEN</div><div class="boss-meter"><i id="guardian-meter"></i></div></section>
<section class="ai-beacon" id="ai-beacon"><span class="ai-pulse"></span><div><small>AI DECISION</small><strong id="ai-intent" data-testid="ai-intent">SCANNING ROUTE</strong><span id="ai-confidence">-- confidence</span></div></section>
<section class="build-strip"><span id="build-label">BASE BUILD</span><span class="danger-readout" id="danger-readout">CLEAR</span></section>
<section class="event-card" id="event-card" aria-hidden="true"><small id="event-kicker">MILESTONE</small><strong id="event-title">ASCENT</strong><span id="event-copy"></span></section>
<div class="caption" id="captions" data-testid="captions">Autonomous systems online. Beginning ascent.</div>
<div class="telemetry" aria-hidden="true"><span>tick <b id="tick" data-testid="tick">0</b></span><span id="renderer-mode">renderer --</span></div>
</div></section></main>
<script src="/tower/art-direction.js" defer></script><script src="/tower/animation-system.js" defer></script><script src="/tower/vfx-system.js" defer></script><script src="/tower/audio-engine.js" defer></script><script src="/tower/tower-renderer.js" defer></script><script src="/tower/app.js" defer></script></body></html>
